    expr: vis.babyExpr,
    onesie: "#FFE156",
    onesieTrim: "#FF7597",
    bellyInflation: swell,
    cheekInflation: swell * 0.9,
    armL: -0.35 + Math.sin(beat * Math.PI) * 0.2,
    armR: -0.35 - Math.sin(beat * Math.PI) * 0.2,
    shadow: false,
  });

  // Dad's expressive patting hand on Baby's back/side!
  const patPush = vis.dadHand.val;
  ctx.save();
  ctx.translate(166 - patPush * 44, -122 - patPush * 12);
  ctx.rotate(-0.32 - patPush * 0.35);
  if (vis.holding) {
    ctx.beginPath();
    ctx.arc(0, 0, 56 + Math.sin(beat * 14) * 8, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 225, 86, 0.38)";
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(0, 0, 36, 28, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#F7CAA8"; ctx.fill(); ctx.stroke();
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(-28, i * 11, 14, 7, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  ctx.restore(); // end rocking group

  // Gentle floating "쉿~" golden hush aura during Rest fakeout
  if (vis.shhMode > 0.05) {
    ctx.save();
    ctx.globalAlpha = clamp(vis.shhMode, 0, 1);
    drawStrokedText(ctx, "쉿~ ♪", 640, 118 - (1 - vis.shhMode) * 18, 54, "#B5F8FF", INK, 9);
    ctx.restore();
  }

  // [L6] Foreground framing botanical fern leaves (depth framing!)
  ctx.save();
  ctx.fillStyle = "#220D10";
  for (const [bx, dir] of [[0, 1], [W, -1]]) {
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.translate(bx, H + 10);
      ctx.rotate(dir * (0.28 + i * 0.28));
      ctx.beginPath();
      ctx.ellipse(0, -110, 34, 120, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();

  // [L7] Minimal "나" tag near Dad's patting hand
  drawYouTag(ctx, 815, 590, bPulse);
}

// =========================================================================
// STAGE 3: 까꿍! 백일 사진관 (7-Layer Pastel Korean 100-Day Photo Studio)
// =========================================================================
function drawPhotoStage(ctx, beat, vis) {
  const bPulse = Math.pow(Math.max(0, 1 - (beat % 1) * 2.2), 2);

  // [L0] Cheerful pastel sunburst cyclorama backdrop
  const bg = ctx.createRadialGradient(640, 340, 60, 640, 360, 820);
  bg.addColorStop(0, "#FFF6DE");
  bg.addColorStop(0.6, "#FFD6E0");
  bg.addColorStop(1, "#FFA8C5");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Rotating pastel studio rays
  ctx.save();
  ctx.translate(640, 380);
  ctx.rotate(beat * 0.08);
  ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
  for (let i = 0; i < 14; i++) {
    ctx.rotate((Math.PI * 2) / 14);
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-34, -900); ctx.lineTo(34, -900); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // [L1] Dual studio softbox diagonal light shafts
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const sx of [160, 1120]) {
    const g = ctx.createLinearGradient(sx, 0, 640, 500);
    g.addColorStop(0, "rgba(255, 255, 240, 0.34)");
    g.addColorStop(1, "rgba(255, 255, 240, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - 60, 0); ctx.lineTo(sx + 60, 0);
    ctx.lineTo(640 + (sx < 640 ? 220 : -220), 620);
    ctx.lineTo(640 + (sx < 640 ? -180 : 180), 620);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // [L2/L3] Swaying "100일" pastel garland banners & giant balloons!
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(80, 42);
  ctx.quadraticCurveTo(640, 148 + bPulse * 10, 1200, 42);
  ctx.stroke();
  const flags = ["★", "1", "0", "0", "일", "축", "하", "★"];
  const fCols = ["#FF6B8B", "#FFD93D", "#6BCB77", "#4D96FF", "#C77DFF", "#FF9F1C", "#FF6B8B", "#4D96FF"];
  for (let i = 0; i < flags.length; i++) {
    const t = (i + 0.5) / flags.length;
    const fx = lerp(120, 1160, t);
    const fy = 42 + 4 * t * (1 - t) * (106 + bPulse * 10);
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(Math.sin(beat * Math.PI + i) * 0.07);
    ctx.beginPath();
    ctx.moveTo(-28, 0); ctx.lineTo(28, 0); ctx.lineTo(0, 56); ctx.closePath();
    ctx.fillStyle = fCols[i]; ctx.fill(); ctx.stroke();
    drawStrokedText(ctx, flags[i], 0, 20, 22, "#FFFFFF", INK, 4);
    ctx.restore();
  }
  ctx.restore();

  // Studio cyclorama floor
  ctx.fillStyle = "#FFF0F5";
  ctx.fillRect(0, 505, W, H - 505);
  ctx.beginPath(); ctx.moveTo(0, 505); ctx.lineTo(W, 505); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();

  // [L4] Royal velvet tufted cushion bench with wooden legs + Contact shadow
  drawContactShadow(ctx, 640, 608, 255, 30, 0.22);
  ctx.fillStyle = "#D49B63"; ctx.lineWidth = 4.5; ctx.strokeStyle = INK;
  roundRectPath(ctx, 448, 550, 26, 56, 8); ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 806, 550, 26, 56, 8); ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 415, 455, 450, 112, 44);
  ctx.fillStyle = "#FF6B9D"; ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 438, 470, 404, 42, 20);
  ctx.fillStyle = "#FF99BA"; ctx.fill();
  // Cute plush star pillow beside Baby
  drawStarPath(ctx, 480, 466 - bPulse * 5, 5, 30, 15);
  ctx.fillStyle = "#FFE156"; ctx.fill(); ctx.stroke();

  // [L5] Sleepy Exhausted Dad sitting on bench right edge (wakes up on snap!)
  drawDad(ctx, {
    x: 825,
    y: 448 + (vis.sleepyDad ? Math.sin(beat * 2) * 8 : 0),
    scale: 0.96,
    mode: "front",
    expr: vis.dadExpr === "thumbsup" ? "thumbsup" : vis.sleepyDad ? "sleep" : "happy",
  });

  // Bouncing Studio Photographer darting Left/Right/Center!
  const phX = 285 + (vis.photoSide === 1 ? 710 : vis.photoSide === -1 ? -40 : 0);
  drawPhotographer(ctx, {
    x: phX,
    y: 442,
    scale: 1.08,
    fanOpen: clamp(vis.fanOpen.val, 0, 1),
    bounce: -bPulse * 14,
    side: vis.photoSide,
    expr: vis.fanOpen.val < 0.25 ? "boo" : "cheer",
  });

  // Star of the show: Baby on velvet cushion!
  const bSq = vis.babyBounce.val;
  drawBaby(ctx, {
    x: 610,
    y: 416 - bPulse * 12 + bSq * 14,
    scale: 1.32,
    sx: 1 + bSq * 0.14,
    sy: 1 - bSq * 0.12,
    expr: vis.babyExpr,
    onesie: "#FFF5B8",
    onesieTrim: "#FF6B9D",
    crown: true,
    handsOnCheeks: vis.babyExpr === "sparkle",
    armL: -0.6 + Math.sin(beat * Math.PI) * 0.35,
    armR: -0.6 - Math.sin(beat * Math.PI) * 0.35,
    shadow: false,
  });

  // Floating Polaroid snapshots popped out from recent snaps!
  for (const snap of vis.photoSnapshots) {
    const t = snap.age / 2.2;
    ctx.save();
    ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    ctx.translate(snap.x, snap.y - t * 90);
    ctx.rotate(snap.rot);
    const sc = snap.age < 0.18 ? Ease.outBack(snap.age / 0.18) : 1;
    ctx.scale(sc, sc);
    roundRectPath(ctx, -56, -64, 112, 128, 10);
    ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = snap.good ? "#FFE8A3" : "#6D6288";
    ctx.fillRect(-46, -54, 92, 82);
    drawStrokedText(ctx, snap.good ? "★" : "💤", 0, -13, 38, snap.good ? "#FF4D79" : "#FFFFFF", INK, 4);
    drawStrokedText(ctx, snap.label, 0, 46, 15, INK, "#FFFFFF", 0);
    ctx.restore();
  }

  // [L6] Clean minimalist Camera Viewfinder Framing Brackets (Zero clutter, super cinematic!)
  ctx.save();
  ctx.strokeStyle = "rgba(38, 25, 44, 0.55)";
  ctx.lineWidth = 6;
  const m = 42, L = 44;
  // 4 corners
  const corners = [
    [m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1],
  ];
  for (const [cx, cy, dx, dy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx + dx * L, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * L);
    ctx.stroke();
  }
  // Subtle center focus bracket pulsing on beat
  ctx.strokeStyle = vis.babyExpr === "sparkle" ? "#FFE156" : "rgba(255, 255, 255, 0.75)";
  ctx.lineWidth = 3;
  const fr = 66 - bPulse * 6;
  ctx.strokeRect(610 - fr, 382 - fr, fr * 2, fr * 2);
  ctx.restore();

  // [L7] Minimal "나" tag at bottom-center shutter indicator
  drawYouTag(ctx, 640, 668, bPulse);
}

// =========================================================================
// STAGE 4: 새벽 3시! 닌자 육퇴 탈출 (7-Layer 1-Point Perspective Stealth Hallway)
// =========================================================================
function drawNinjaStage(ctx, beat, vis) {
  const bPulse = Math.pow(Math.max(0, 1 - (beat % 1) * 2.2), 2);
  const progress = clamp(vis.ninjaSteps / 34, 0, 1);

  // [L0] Deep midnight hallway perspective walls
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#121633");
  bg.addColorStop(1, "#222A54");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 1-point perspective hallway geometry toward the glowing GOLDEN EXIT DOOR!
  const vpX = 640, vpY = 290;
  // Left & Right walls with perspective framed family photos & glowing hallway sconces!
  ctx.fillStyle = "#1E254D";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(vpX - 180, vpY - 140); ctx.lineTo(vpX - 180, vpY + 170); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(vpX + 180, vpY - 140); ctx.lineTo(vpX + 180, vpY + 170); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // Perspective wall frames & soft blue wall sconces
  ctx.save();
  ctx.lineWidth = 4; ctx.strokeStyle = "#3A4680"; ctx.fillStyle = "#293466";
  ctx.beginPath(); ctx.moveTo(110, 150); ctx.lineTo(250, 195); ctx.lineTo(250, 375); ctx.lineTo(110, 420); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(315, 210); ctx.lineTo(405, 232); ctx.lineTo(405, 360); ctx.lineTo(315, 382); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1170, 150); ctx.lineTo(1030, 195); ctx.lineTo(1030, 375); ctx.lineTo(1170, 420); ctx.closePath(); ctx.fill(); ctx.stroke();
  // Baseboards
  ctx.strokeStyle = "#4A5899"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(vpX - 180, vpY + 170); ctx.moveTo(W, H); ctx.lineTo(vpX + 180, vpY + 170); ctx.stroke();
  ctx.restore();

  // Wooden plank floor scrolling smoothly with every stealth step!
  ctx.fillStyle = "#3E2E4D";
  ctx.beginPath();
  ctx.moveTo(vpX - 180, vpY + 170);
  ctx.lineTo(vpX + 180, vpY + 170);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Perspective floorboard lines scrolling!
  ctx.strokeStyle = "rgba(18, 12, 30, 0.55)";
  ctx.lineWidth = 3;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(vpX + i * 56, vpY + 170);
    ctx.lineTo(vpX + i * 240, H);
    ctx.stroke();
  }
  const scrollOff = (vis.ninjaSteps * 0.35) % 1;
  for (let j = 0; j < 6; j++) {
    const k = ((j + scrollOff) / 6) ** 1.6;
    const fy = lerp(vpY + 170, H, k);
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
  }

  // [L1/L2] THE LEGENDARY EXIT DOOR ("자유시간 · 치킨 & 게임") getting closer!
  const doorScale = lerp(0.72, 1.38, progress);
  ctx.save();
  ctx.translate(vpX, vpY + 18);
  ctx.scale(doorScale, doorScale);

  // Golden freedom glow spilling around the door cracks!
  const glowR = 220 + vis.ninjaDoorOpen * 260;
  const dg = ctx.createRadialGradient(0, 0, 20, 0, 0, glowR);
  dg.addColorStop(0, `rgba(255, 226, 110, ${0.42 + vis.ninjaDoorOpen * 0.55})`);
  dg.addColorStop(1, "rgba(255, 200, 80, 0)");
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

  // Door frame
  roundRectPath(ctx, -84, -124, 168, 250, 12);
  ctx.fillStyle = "#FFF1A8"; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();

  // Door panel (swings open on finale!)
  ctx.save();
  ctx.translate(-76, 0);
  ctx.scale(1 - vis.ninjaDoorOpen * 0.85, 1);
  roundRectPath(ctx, 0, -116, 152, 236, 8);
  ctx.fillStyle = "#7D5340"; ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 18, -94, 116, 84, 6);
  ctx.fillStyle = "#664030"; ctx.fill(); ctx.stroke();
  // Gleaming brass doorknob
  ctx.beginPath(); ctx.arc(128, 12, 11, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE156"; ctx.fill(); ctx.stroke();
  ctx.restore();

  // Neon freedom sign above door!
  roundRectPath(ctx, -78, -162, 156, 32, 16);
  ctx.fillStyle = "#162044"; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = "#72EFDD"; ctx.stroke();
  drawStrokedText(ctx, "자유시간 EXIT", 0, -146, 18, "#FFE156", INK, 3);
  ctx.restore();

  // [L3] Dangerous Squeaky Rubber Ducks along hallway floor!
  drawRubberDuck(ctx, 355, 565, 1.15, vis.ninjaDuckSquish);
  drawRubberDuck(ctx, 935, 585, 1.25, vis.ninjaDuckSquish);

  // [L4/L5] Stealth Pajama Ninja Dad tiptoeing right down the center!
  const dadY = 505 - bPulse * 14;
  drawContactShadow(ctx, 640, 616, 76, 18, 0.42);
  drawDad(ctx, {
    x: 640 + Math.sin(vis.ninjaSteps * 1.6) * 26,
    y: dadY,
    scale: 1.38,
    mode: "ninja",
    expr: vis.ninjaFrozen ? "crane" : vis.dadExpr,
    stepPhase: vis.ninjaSteps * 1.8,
    ninjaBand: true,
  });

  // Picture-in-Picture BABY MONITOR CAM (top-right, pulses red on Freeze/Miss!)
  ctx.save();
  const monX = 990, monY = 44, monW = 242, monH = 170;
  roundRectPath(ctx, monX, monY, monW, monH, 20);
  ctx.fillStyle = vis.ninjaMonitorAlert > 0.2 ? "#3D182A" : "#15262E";
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = vis.ninjaMonitorAlert > 0.2 ? "#FF4D79" : "#72EFDD";
  ctx.stroke();

  ctx.save();
  roundRectPath(ctx, monX + 6, monY + 6, monW - 12, monH - 12, 14);
  ctx.clip();
  // Night-vision scanlines
  ctx.fillStyle = "rgba(114, 239, 221, 0.06)";
  for (let sy = monY; sy < monY + monH; sy += 8) ctx.fillRect(monX, sy, monW, 3);
  drawBaby(ctx, {
    x: monX + monW * 0.5,
    y: monY + monH * 0.62,
    scale: 0.72,
    expr: vis.ninjaMonitorAlert > 0.5 ? "shock" : vis.ninjaFrozen ? "mischievous" : "sleepy",
    onesie: "#72EFDD",
    shadow: false,
  });
  ctx.restore();
  // Monitor status badge
  ctx.fillStyle = vis.ninjaMonitorAlert > 0.2 ? "#FF4D79" : "#6BCB77";
  ctx.beginPath(); ctx.arc(monX + 24, monY + 24, 7, 0, Math.PI * 2); ctx.fill();
  drawStrokedText(ctx, vis.ninjaFrozen ? "뒤척임!!" : "BABY CAM", monX + 122, monY + 24, 17, "#FFFFFF", INK, 3);
  ctx.restore();

  // [L6] Foreground framing dark doorframe edges
  ctx.fillStyle = "#0B0D21";
  ctx.fillRect(0, 0, 38, H);
  ctx.fillRect(W - 38, 0, 38, H);

  // [L7] Minimal "나" tag under Ninja Dad
  drawYouTag(ctx, 640, 668, bPulse);
}

// Glowing cartoon eyes rendered OVER the pitch-black blackout in Stage 4!
function drawNinjaBlackoutEyes(ctx, alpha, beat, vis) {
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  const dx = 640 + Math.sin(vis.ninjaSteps * 1.6) * 26;
  const dy = 432;
  // Dad's tense glowing white cartoon eyes in the pitch dark!
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(dx + s * 22, dy, 13, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(dx + s * 22 + Math.sin(beat * Math.PI) * 3, dy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.fill();
  }
  // Faint glowing "Zzz..." floating in top-right monitor corner
  const zBob = Math.sin(beat * 2) * 8;
  drawStrokedText(ctx, "Zzz...", 1110, 126 + zBob, 28, "#72EFDD", "#000000", 4);
  ctx.restore();
}

// =========================================================================
// 5 BESPOKE 3.2-SECOND CINEMATIC TITLE CARD ANIMATIONS
// =========================================================================
function drawTitleCard(ctx, stage, elapsed, totalDur) {
  const t = clamp(elapsed / totalDur, 0, 1);
  const titlePop = t > 0.45 ? Ease.outBack((t - 0.45) / 0.24, 2.2) : 0;

  // Stage-specific cinematic backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, stage.themeTop);
  bg.addColorStop(1, stage.themeBot);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (stage.id === "pacifier") {
    // Glowing crescent moon + spinning pacifier curving from distant moon to foreground landing!
    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    for (let i = 0; i < 28; i++) {
      ctx.beginPath();
      ctx.arc((i * 197) % W, (i * 113) % H, 2 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }
    // Authentic geometric crescent moon (no background color mismatch!)
    ctx.save();
    ctx.translate(960, 190);
    ctx.rotate(-0.3);
    ctx.beginPath();
    ctx.arc(0, 0, 92, 0.25 * Math.PI, 1.75 * Math.PI, false);
    ctx.arc(38, 0, 74, 1.62 * Math.PI, 0.38 * Math.PI, true);
    ctx.closePath();
    ctx.fillStyle = "#FFF199";
    ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();

    // 3D curved fly-in like Rhythm Heaven's Frisbee title card!
    const ft = clamp(t / 0.52, 0, 1);
    const e = Ease.inOutCubic(ft);
    const px = lerp(960, 310, e) + Math.sin(ft * Math.PI) * 160;
    const py = lerp(190, 480, e) - Math.sin(ft * Math.PI) * 210;
    const sc = lerp(0.35, 3.1, e);
    drawPacifier(ctx, px, py, sc, ft * 16, true);
    if (ft > 0.35 && ft < 0.55) {
      // Lens glint star!
      drawStarPath(ctx, px + 24, py - 24, 4, 48 * Math.sin(((ft - 0.35) / 0.2) * Math.PI), 10);
      ctx.fillStyle = "#FFFFFF"; ctx.fill();
    }
  } else if (stage.id === "burp") {
    // Big-band velvet spotlight + rising iridescent giant soap bubble popping on Beat 4!
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const sp = ctx.createRadialGradient(640, 340, 20, 640, 340, 460);
    sp.addColorStop(0, "rgba(255, 224, 130, 0.45)");
    sp.addColorStop(1, "rgba(255, 160, 80, 0)");
    ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const bt = clamp(t / 0.46, 0, 1);
    if (t < 0.48) {
      const r = lerp(24, 155, Ease.outBack(bt));
      const g = ctx.createRadialGradient(610, 310, 10, 640, 340, r);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(0.55, "rgba(180,240,255,0.4)");
      g.addColorStop(1, "rgba(255,180,235,0.65)");
      ctx.beginPath(); ctx.arc(640, lerp(590, 340, Ease.outCubic(bt)), r, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    } else {
      // Musical notes exploding from popped bubble!
      const pt = clamp((t - 0.48) / 0.4, 0, 1);
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8 + 0.3;
        const d = Ease.outCubic(pt) * 280;
        drawStrokedText(ctx, i % 2 ? "♪" : "♫", 640 + Math.cos(a) * d, 340 + Math.sin(a) * d, 46, "#FFE156", INK, 6);
      }
    }
  } else if (stage.id === "photo") {
    // Rotating studio aperture blades opening + blinding flash popping instant photo!
    ctx.save();
    ctx.translate(640, 360);
    const open = Ease.outExpo(clamp(t / 0.5, 0, 1));
    ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.fillRect(-18, 60 + open * 200, 36, 480);
    }
    ctx.restore();
    // Spinning white Polaroid frame landing!
    const sc = Ease.outBack(clamp(t / 0.48, 0, 1));
    ctx.save();
    ctx.translate(640, 345);
    ctx.rotate(lerp(-0.45, -0.05, Ease.outCubic(clamp(t / 0.48, 0, 1))));
    ctx.scale(sc, sc);
    roundRectPath(ctx, -230, -180, 460, 360, 22);
    ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = "#FFE5EE";
    ctx.fillRect(-205, -155, 410, 260);
    drawBaby(ctx, { x: 0, y: 12, scale: 1.22, expr: "sparkle", handsOnCheeks: true, crown: true, shadow: false });
    ctx.restore();
  } else if (stage.id === "ninja") {
    // Spy spotlight sweeping across dark hallway and freezing Ninja Dad!
    const sweepX = lerp(220, 640, Ease.outCubic(clamp(t / 0.45, 0, 1)));
    ctx.fillStyle = "#0A0C1D";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath();
    ctx.arc(sweepX, 370, 215, 0, Math.PI * 2);
    ctx.clip();
    const lg = ctx.createRadialGradient(sweepX, 370, 20, sweepX, 370, 215);
    lg.addColorStop(0, "#3D4B8C");
    lg.addColorStop(1, "#181E42");
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
    drawDad(ctx, { x: 640, y: 400, scale: 1.5, mode: "ninja", expr: "crane", ninjaBand: true });
    ctx.restore();
    ctx.beginPath();
    ctx.arc(sweepX, 370, 215, 0, Math.PI * 2);
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(114, 239, 221, 0.7)"; ctx.stroke();
  } else {
    // GRAND REMIX: Spinning 4-quadrant rainbow prism & all stars converging!
    ctx.save();
    ctx.translate(640, 360);
    ctx.rotate(t * 2.2);
    const cols = ["#FF5D8F", "#FF9F1C", "#00B4D8", "#7B2CBF"];
    for (let i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8);
      ctx.fillStyle = cols[i % 4];
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-42, -900); ctx.lineTo(42, -900); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    const s = Ease.outBack(clamp(t / 0.45, 0, 1));
    drawBaby(ctx, { x: 640, y: 290, scale: 1.35 * s, expr: "sparkle", crown: true, handsOnCheeks: true, onesie: "#FFE156", shadow: false });
  }

  // Bold cel-shaded Title & Genre Pill landing right on Beat 4!
  if (titlePop > 0.01) {
    ctx.save();
    ctx.translate(640, 560);
    ctx.scale(titlePop, titlePop);
    // Pill genre tag
    roundRectPath(ctx, -180, -96, 360, 42, 21);
    ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = stage.accent; ctx.stroke();
    drawStrokedText(ctx, `STAGE ${stage.number}  ·  ${stage.genre}`, 0, -75, 20, stage.accent, INK, 0);
    // Giant bold cel-shaded title
    drawStrokedText(ctx, stage.title, 0, -8, 76, "#FFFFFF", INK, 16);
    drawStrokedText(ctx, stage.subtitle, 0, 56, 26, "#FFF3B0", INK, 7);
    ctx.restore();
  }
}

function renderStageWorld(ctx, subStage, beat, vis, cam) {
  if (subStage === "pacifier") drawPacifierStage(ctx, beat, vis, cam);
  else if (subStage === "burp") drawBurpStage(ctx, beat, vis, cam);
  else if (subStage === "photo") drawPhotoStage(ctx, beat, vis, cam);
  else drawNinjaStage(ctx, beat, vis, cam);
}


/* ===== src/game.js ===== */
// Complete Game Engine: State Machine, Lookahead Scheduler, Judge Engine,
// Mascot Stage-Select Map, In-World Practice, 5-Step Epilogue, Calibration, LocalStorage & QA Bot

const SAVE_KEY = "baby_beat_heaven_v1";

function loadSave() {
  const def = {
    stages: {}, // id -> { rank: "superb"|"ok"|"tryagain", bestAcc: 0..100, skillStar: bool, medal: bool, perfect: bool, played: bool }
    rhythmIQ: 72,
    remixUnlocked: false,
    remixUnlockSeen: false,
    demoUnlockAll: false,
    offsetMs: 0,
    visualGuide: false,
    masterVol: 0.86,
    musicVol: 0.85,
    sfxVol: 0.95,
  };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return def;
    const parsed = JSON.parse(raw);
    return { ...def, ...parsed, stages: { ...def.stages, ...(parsed.stages || {}) } };
  } catch {
    return def;
  }
}

function writeSave(save) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {}
}

class BabyBeatHeavenApp {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.audio = new StudioAudio();
    this.cam = new CameraRig();
    this.particles = new ParticleSystem();
    this.vis = new StageVisualState();
    this.save = loadSave();

    this.audio.offsetMs = this.save.offsetMs || 0;
    this.audio.masterVol = this.save.masterVol ?? 0.86;
    this.audio.musicVol = this.save.musicVol ?? 0.85;
    this.audio.sfxVol = this.save.sfxVol ?? 0.95;

    // Query params for automated QA bot (?bot=perfect | ?bot=sloppy)
    const params = new URLSearchParams(window.location.search);
    this.botMode = params.get("bot") || null;

    // Core UI state
    this.state = "TITLE"; // TITLE | MENU | TITLE_CARD | PRACTICE | PLAY | RESULT | SETTINGS | CALIBRATE
    this.prevState = "MENU";
    this.time = 0;
    this.stateTime = 0;

    // Menu state
    this.selectedIdx = 0;
    this.menuBgTop = STAGES[0].themeTop;
    this.menuBgBot = STAGES[0].themeBot;
    this.cursorY = new Spring(0, 260, 20);
    this.unlockFlash = 0; // white light-wave sweep on Remix unlock!
    this.saveToast = 0;
    this.perfectChallengeMode = false;

    // Active stage run
    this.stage = STAGES[0];
    this.chart = null;
    this.songStartTime = 0;
    this.paused = false;
    this.pauseStartedAt = 0;
    this.lastEighthScheduled = -1;
    this.nextCueIdx = 0;
    this.activeSubStage = "pacifier";
    this.currentBeat = 0;
    this.lastWholeBeat = -1;
    this.schedulerTimer = null;
    this.holdingDown = false;
    this.activeHoldEv = null;
    this.combo = 0;
    this.maxCombo = 0;
    this.perfectCount = 0;
    this.goodCount = 0;
    this.missCount = 0;
    this.skillStarGot = false;
    this.perfectFailed = false;
    this.finishTriggered = false;
    this.lastDeltaMs = null;

    // Practice state
    this.practicePhase = "dialogue"; // dialogue | live | ready
    this.practiceLineIdx = 0;
    this.practiceSuccess = 0;
    this.practiceTargetSuccess = 3;
    this.practiceEvents = [];
    this.practiceCycleBeat = 0;
    this.practiceStartTime = 0;
    this.practiceLastCueBeat = -1;

    // Result 5-step epilogue state
    this.result = null;
    this.resultStampSpring = new Spring(0, 320, 15);
    this.resultStamped = false;
    this.resultTypedChars = 0;
    this.resultTypeAcc = 0;

    // Calibration state
    this.calStartTime = 0;
    this.calTaps = [];
    this.calLastTick = -1;

    // Hitboxes rebuilt every render for crisp mouse & touch buttons
    this.buttons = [];
    this.hoverBtnId = null;

    // Resize & input bindings
    this._bindEvents();
    this._resize();
    window.addEventListener("resize", () => this._resize());

    // Expose read-only inspection / QA test handle
    window.__BBH = this;

    // Main loop
    this.lastFrame = performance.now();
    requestAnimationFrame((ts) => this._loop(ts));
  }

  _resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.round(W * dpr);
    this.canvas.height = Math.round(H * dpr);
    this.dpr = dpr;
  }

  _canvasPoint(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * W;
    const y = ((e.clientY - rect.top) / rect.height) * H;
    return { x, y };
  }

  _bindEvents() {
    this.canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      this.audio.ensure();
      const pt = this._canvasPoint(e);
      this._onPointerDown(pt.x, pt.y);
    });
    window.addEventListener("pointerup", () => {
      this._onActionRelease();
    });
    this.canvas.addEventListener("pointermove", (e) => {
      const pt = this._canvasPoint(e);
      this.hoverBtnId = null;
      for (let i = this.buttons.length - 1; i >= 0; i--) {
        const b = this.buttons[i];
        if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
          this.hoverBtnId = b.id;
          break;
        }
      }
      this.canvas.style.cursor = this.hoverBtnId ? "pointer" : "default";
    });

    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      this.audio.ensure();
      const code = e.code;
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(code)) {
        e.preventDefault();
      }
      this._onKeyDown(code);
    });
    window.addEventListener("keyup", (e) => {
      const code = e.code;
      if (["Space", "KeyZ", "KeyJ", "Enter"].includes(code)) {
        this._onActionRelease();
      }
    });
  }

  _registerBtn(id, x, y, w, h, onClick) {
    this.buttons.push({ id, x, y, w, h, onClick });
    return this.hoverBtnId === id;
  }

  _hitButton(x, y) {
    for (let i = this.buttons.length - 1; i >= 0; i--) {
      const b = this.buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.onClick();
        return true;
      }
    }
    return false;
  }

  // ===== GLOBAL INPUT ROUTING =====
  _onPointerDown(x, y) {
    if (this.state === "TITLE") {
      this.audio.playCue("ui_ok");
      this.goMenu();
      return;
    }
    if (this._hitButton(x, y)) return;

    if (this.state === "TITLE_CARD" && this.stateTime > 0.7) {
      this._finishTitleCard();
    } else if (this.state === "PRACTICE") {
      if (this.practicePhase === "dialogue") {
        this._advancePracticeDialogue();
      } else if (this.practicePhase === "live") {
        this._onActionPress();
      }
    } else if (this.state === "PLAY" && !this.paused) {
      this._onActionPress();
    } else if (this.state === "RESULT") {
      if (!this.resultStamped && this.stateTime > 0.6) {
        this._triggerResultStamp();
      }
    } else if (this.state === "CALIBRATE") {
      this._onCalibrateTap();
    }
  }

  _onKeyDown(code) {
    if (this.state === "TITLE") {
      if (["Space", "Enter", "KeyZ"].includes(code)) {
        this.audio.playCue("ui_ok");
        this.goMenu();
      }
      return;
    }
    if (this.state === "MENU") {
      if (code === "ArrowUp" || code === "KeyW") {
        this.selectedIdx = (this.selectedIdx + STAGES.length - 1) % STAGES.length;
        this.audio.playCue("ui_move");
      } else if (code === "ArrowDown" || code === "KeyS") {
        this.selectedIdx = (this.selectedIdx + 1) % STAGES.length;
        this.audio.playCue("ui_move");
      } else if (code === "Enter" || code === "Space" || code === "KeyZ") {
        this._tryLaunchSelected(true);
      } else if (code === "KeyX") {
        this._tryLaunchSelected(false);
      }
      return;
    }
    if (this.state === "TITLE_CARD") {
      if ((code === "KeyX" || code === "Escape") && this.stateTime > 0.5) {
        this._finishTitleCard();
      }
      return;
    }
    if (this.state === "PRACTICE") {
      if (code === "KeyX" || code === "Escape") {
        this.audio.playCue("ui_ok");
        this.startMainPlay();
      } else if (["Space", "KeyZ", "KeyJ", "Enter"].includes(code)) {
        if (this.practicePhase === "dialogue") this._advancePracticeDialogue();
        else if (this.practicePhase === "live") this._onActionPress();
      }
      return;
    }
    if (this.state === "PLAY") {
      if (code === "Escape") {
        this.togglePause();
        return;
      }
      if (!this.paused && ["Space", "KeyZ", "KeyJ", "Enter"].includes(code)) {
        this._onActionPress();
      }
      return;
    }
    if (this.state === "RESULT") {
      if (["Space", "Enter", "KeyZ"].includes(code)) {
        if (!this.resultStamped && this.stateTime > 0.6) this._triggerResultStamp();
        else if (this.resultStamped && this.stateTime > 3.6) this.goMenu();
      } else if (code === "KeyR" && this.resultStamped) {
        this.startStage(this.stage.id, false, this.perfectChallengeMode);
      }
      return;
    }
    if (this.state === "CALIBRATE") {
      if (code === "Escape") this.openSettings();
      else if (["Space", "KeyZ", "Enter"].includes(code)) this._onCalibrateTap();
      return;
    }
    if (this.state === "SETTINGS") {
      if (code === "Escape") this.goMenu();
    }
  }

  // ===== SCENE TRANSITIONS =====
  isStageUnlocked(st) {
    if (!st.isRemix) return true;
    return this.save.remixUnlocked || this.save.demoUnlockAll;
  }

  countClearedCoreStages() {
    let c = 0;
    for (const st of STAGES) {
      if (st.isRemix) continue;
      const rec = this.save.stages[st.id];
      if (rec && (rec.rank === "superb" || rec.rank === "ok")) c++;
    }
    return c;
  }

  goMenu() {
    this._stopStageScheduler();
    this.paused = false;
    this.state = "MENU";
    this.stateTime = 0;
    this.cam.reset();
    this.particles.clear();
    this.audio.startLoop("menu", 118);

    // Check Remix unlock trigger (clearing any 2 core stages!)
    if (!this.save.remixUnlocked && this.countClearedCoreStages() >= 2) {
      this.save.remixUnlocked = true;
      writeSave(this.save);
    }
    if (this.save.remixUnlocked && !this.save.remixUnlockSeen) {
      this.save.remixUnlockSeen = true;
      writeSave(this.save);
      this.selectedIdx = 4; // focus Remix!
      this.unlockFlash = 1.0;
      this.audio.playCue("unlock_burst");
      this.particles.spawnConfetti(W * 0.5, H * 0.45, 55, 520);
    }
  }

  openSettings() {
    this._stopStageScheduler();
    this.particles.clear();
    this.prevState = this.state === "CALIBRATE" ? "MENU" : this.state;
    this.state = "SETTINGS";
    this.stateTime = 0;
    this.audio.playCue("ui_ok");
  }

  startCalibration() {
    this.audio.stopLoop();
    this.state = "CALIBRATE";
    this.stateTime = 0;
    this.calTaps = [];
    this.calLastTick = -1;
    this.calStartTime = this.audio.now() + 0.5;
    this.audio.playCue("ui_ok");
  }

  _tryLaunchSelected(withPractice) {
    const st = STAGES[this.selectedIdx];
    if (!this.isStageUnlocked(st)) {
      this.audio.playCue("miss_bonk");
      this.cam.shake(0.25);
      return;
    }
    this.audio.playCue("ui_ok");
    this.startStage(st.id, withPractice, false);
  }

  startStage(stageId, withPractice = true, perfectMode = false) {
    this._stopStageScheduler();
    this.stage = getStageById(stageId);
    this.wantPractice = withPractice && !this.botMode;
    this.perfectChallengeMode = perfectMode;
    this.state = "TITLE_CARD";
    this.stateTime = 0;
    this.cam.reset();
    this.particles.clear();
    this.vis.reset();
    this.audio.playTitleCardJingle(this.stage.id);
  }

  _finishTitleCard() {
    if (this.wantPractice) this.startPractice();
    else this.startMainPlay();
  }

  // ===== IN-WORLD CONVERSATIONAL PRACTICE =====
  startPractice() {
    this.state = "PRACTICE";
    this.stateTime = 0;
    this.practicePhase = "dialogue";
    this.practiceLineIdx = 0;
    this.practiceSuccess = 0;
    this.vis.reset();
    this.cam.reset();
    this.particles.clear();
    this.activeSubStage = this.stage.isRemix ? "pacifier" : this.stage.id;
    this.audio.startLoop("practice", this.stage.bpm, this.activeSubStage);
  }

  _advancePracticeDialogue() {
    this.audio.playCue("ui_ok");
    this.practiceLineIdx++;
    if (this.practiceLineIdx >= this.stage.practiceLines.length) {
      if (this.stage.isRemix) {
        // Remix skips tedious practice and jumps right into the show!
        this.startMainPlay();
        return;
      }
      this.practicePhase = "live";
      this.practiceStartTime = this.audio.now() + 0.35;
      this.practiceLastCueBeat = -1;
      this.practiceEvents = [];
    }
  }

  _updatePractice(dt) {
    const bpm = this.stage.bpm;
    const spb = 60 / bpm;
    this.currentBeat = this.audio.getLoopBeat();
    if (this.practicePhase !== "live") return;

    const pBeat = (this.audio.now() - this.practiceStartTime) / spb;
    if (pBeat < 0) return;

    // Schedule 4-beat practice call & response cycles continuously until 3 hits!
    const whole = Math.floor(pBeat);
    if (whole > this.practiceLastCueBeat) {
      this.practiceLastCueBeat = whole;
      const m = whole % 4;
      const cycleStart = whole - m;
      const targetTime = this.practiceStartTime + (cycleStart + 2) * spb;
      if (this.stage.id === "pacifier") {
        if (m === 0) {
          this.audio.playCue("baby_puff");
          this.vis.babyExpr = "puff"; this.vis.babyExprTimer = 0.5; this.vis.babyCheek.target = 1;
        } else if (m === 1) {
          this.audio.playCue("baby_spit");
          this.vis.babyExpr = "spit"; this.vis.babyExprTimer = 0.45; this.vis.babyCheek.target = 0;
          this.vis.pacifiers = [{ startBeat: pBeat, targetBeat: pBeat + 1, done: false }];
          this.practiceEvents.push({ beat: cycleStart + 2, time: targetTime, type: "tap", judged: false });
        }
      } else if (this.stage.id === "burp") {
        if (m === 0 || m === 1) {
          this.audio.playCue("pat_todak");
          this.vis.babyBounce.kick(5);
        }
        if (m === 1) {
          this.practiceEvents.push({ beat: cycleStart + 2, time: this.practiceStartTime + (cycleStart + 2) * spb, type: "tap", judged: false });
          this.practiceEvents.push({ beat: cycleStart + 3, time: this.practiceStartTime + (cycleStart + 3) * spb, type: "tap", judged: false });
        }
      } else if (this.stage.id === "photo") {
        if (m === 0) {
          this.audio.playCue("photo_peek");
          this.vis.fanOpen.target = 1;
        } else if (m === 2) {
          this.audio.playCue("photo_boo");
          this.vis.fanOpen.target = 0;
          this.vis.babyExpr = "sparkle"; this.vis.babyExprTimer = 0.65;
          this.practiceEvents.push({ beat: cycleStart + 3, time: this.practiceStartTime + (cycleStart + 3) * spb, type: "tap", judged: false });
        }
      } else if (this.stage.id === "ninja") {
        this.audio.playCue("count_tick");
        this.practiceEvents.push({ beat: whole + 1, time: this.practiceStartTime + (whole + 1) * spb, type: "tap", judged: false });
      }
    }

    // Expire missed practice targets cleanly
    const nowT = this.audio.now();
    for (const ev of this.practiceEvents) {
      if (!ev.judged && nowT - ev.time > 0.16) {
        ev.judged = true;
      }
    }
    this.currentBeat = pBeat;
  }

  // ===== MAIN STAGE PLAY ENGINE =====
  startMainPlay() {
    this._stopStageScheduler();
    this.audio.stopLoop();
    this.state = "PLAY";
    this.stateTime = 0;
    this.paused = false;
    this.vis.reset();
    this.cam.reset();
    this.particles.clear();

    this.chart = this.stage.buildChart();
    // Clone mutable judge state onto events
    for (const ev of this.chart.events) {
      ev.judged = false;
      ev.grade = null; // "perfect" | "good" | "miss"
    }

    this.activeSubStage = this.stage.isRemix ? "pacifier" : this.stage.id;
    this.songStartTime = this.audio.now() + 0.35;
    this.lastEighthScheduled = -1;
    this.nextCueIdx = 0;
    this.currentBeat = 0;
    this.lastWholeBeat = -1;
    this.holdingDown = false;
    this.activeHoldEv = null;
    this.combo = 0;
    this.maxCombo = 0;
    this.perfectCount = 0;
    this.goodCount = 0;
    this.missCount = 0;
    this.skillStarGot = false;
    this.perfectFailed = false;
    this.finishTriggered = false;
    this.lastDeltaMs = null;

    // Sample-accurate 20ms lookahead audio scheduler
    const tick = () => this._scheduleAudioAhead();
    tick();
    this.schedulerTimer = setInterval(tick, 20);
  }

  _stopStageScheduler() {
    if (this.schedulerTimer) {
      clearInterval(this.schedulerTimer);
      this.schedulerTimer = null;
    }
  }

  togglePause() {
    if (this.state !== "PLAY" || this.finishTriggered) return;
    if (!this.paused) {
      this.paused = true;
      this.pauseStartedAt = this.audio.now();
      this._stopStageScheduler();
      this.audio.playCue("ui_back");
    } else {
      const pausedDur = this.audio.now() - this.pauseStartedAt;
      this.songStartTime += pausedDur;
      this.paused = false;
      this.audio.playCue("ui_ok");
      this.schedulerTimer = setInterval(() => this._scheduleAudioAhead(), 20);
    }
  }

  _subStageAtBeat(beat) {
    if (!this.stage.isRemix) return this.stage.id;
    let sub = "pacifier";
    for (const seg of this.chart.subTimeline) {
      if (beat >= seg.startBeat) sub = seg.subStage;
    }
    return sub;
  }

  _scheduleAudioAhead() {
    if (this.state !== "PLAY" || this.paused) return;
    const spb = 60 / this.stage.bpm;
    const secPerEighth = spb / 2;
    const now = this.audio.now();
    const horizon = now + 0.145;

    // 1. Schedule multi-track BGM eighth notes (skip stale past steps on tab wake/seek)
    while (true) {
      const nextStep = this.lastEighthScheduled + 1;
      const beatPos = nextStep / 2;
      if (beatPos >= this.chart.totalBeats - 2) break;
      const t = this.songStartTime + nextStep * secPerEighth;
      if (t > horizon) break;
      this.lastEighthScheduled = nextStep;
      if (t < now - 0.06) continue;
      // Don't play heavy BGM during count-in beats 0..3 (clean percussion count-in!)
      if (beatPos >= 4) {
        const sub = this._subStageAtBeat(beatPos);
        const transpose = this.chart.keyChangeBeat && beatPos >= this.chart.keyChangeBeat ? 2 : 0;
        this.audio.playStageEighth(this.stage.id, nextStep, Math.max(now, t), this.stage.bpm, transpose, sub);
      }
    }

    // 2. Schedule vocal & rhythm cues strictly onto AudioContext timestamps
    while (this.nextCueIdx < this.chart.cues.length) {
      const cue = this.chart.cues[this.nextCueIdx];
      const t = this.songStartTime + cue.beat * spb;
      if (t > horizon) break;
      this.nextCueIdx++;
      if (t < now - 0.06) continue;
      if (cue.kind) this.audio.playCue(cue.kind, Math.max(now, t));
    }
  }

  // Visual reactions driven right when the beat passes a cue!
  _processVisualCues(beat) {
    for (const cue of this.chart.cues) {
      if (cue._visFired || beat < cue.beat) continue;
      cue._visFired = true;

      if (cue.tag === "smash_cut") {
        this.activeSubStage = cue.subStage;
        this.vis.pacifiers = [];
        this.vis.fanOpen.set(0);
        this.vis.ninjaFrozen = false;
        this.cam.blackoutTarget = 0;
        this.cam.flash(0.55, "#FFFFFF");
        this.cam.hitPunch(0.08, (Math.random() < 0.5 ? -1 : 1) * 0.18);
        continue;
      }

      if (cue.tag === "skill_star") {
        this.vis.skillStarActive = true;
        this.cam.cinemaBarsTarget = 1;
        this.cam.zoom.target = 1.07;
        this.particles.spawnComicText(W * 0.5, 118, "★ 스킬 스타 찬스!", "#FFE156", 44, 1.1);
        continue;
      }

      // Stage-specific visual choreography
      if (cue.subStage === "pacifier") {
        if (cue.tag === "puff") {
          this.vis.babyExpr = "puff"; this.vis.babyExprTimer = 0.6;
          this.vis.babyCheek.target = 1;
          this.vis.babyBounce.kick(6);
        } else if (cue.tag === "lob_charge") {
          this.vis.babyExpr = "puff"; this.vis.babyExprTimer = 0.9;
          this.vis.babyCheek.target = 1;
          this.cam.zoom.target = 1.09;
        } else if (cue.tag === "spit" || cue.tag === "lob_spit") {
          this.vis.babyExpr = "spit"; this.vis.babyExprTimer = 0.45;
          this.vis.babyCheek.target = 0;
          this.vis.babyBounce.kick(-8);
          this.vis.pacifiers.push({
            startBeat: cue.beat,
            targetBeat: cue.targetBeat,
            lane: cue.lane || 0,
            isLob: cue.tag === "lob_spit",
            golden: !!cue.golden,
            done: false,
          });
        }
      } else if (cue.subStage === "burp") {
        if (cue.tag === "demo_pat") {
          this.vis.babyBounce.kick(5.5);
          this.cam.beatPulse(0.03);
        } else if (cue.tag === "burp_charge") {
          this.vis.babyExpr = "burp_charge"; this.vis.babyExprTimer = 1.5;
          this.vis.babyBelly.target = 1;
          this.cam.zoom.target = 1.1;
        } else if (cue.tag === "shh") {
          this.vis.shhMode = 1.0;
          this.vis.babyExpr = "sleepy"; this.vis.babyExprTimer = 1.5;
          this.cam.vignetteTarget = 0.44;
          this.cam.zoom.target = 1.06;
        }
      } else if (cue.subStage === "photo") {
        if (cue.tag === "peek") {
          this.vis.photoSide = 0;
          this.vis.fanOpen.target = 1;
          this.vis.sleepyDad = !!cue.sleepyDad;
          this.cam.panTo(0, 0, 1.03, 0);
        } else if (cue.tag === "boo") {
          this.vis.fanOpen.target = 0;
          this.vis.babyExpr = "sparkle"; this.vis.babyExprTimer = 0.8;
          this.vis.babyBounce.kick(-7);
          this.cam.zoom.target = 1.08;
        } else if (cue.tag === "whip_left") {
          this.vis.photoSide = -1;
          this.vis.babyExpr = "happy";
          this.cam.panTo(-65, -10, 1.07, -0.025);
        } else if (cue.tag === "whip_right") {
          this.vis.photoSide = 1;
          this.vis.babyExpr = "happy";
          this.cam.panTo(65, -10, 1.07, 0.025);
        } else if (cue.tag === "pose") {
          this.vis.photoSide = 0;
          this.vis.babyExpr = "sparkle"; this.vis.babyExprTimer = 1.7;
          this.cam.panTo(0, -18, 1.12, 0);
          this.particles.burstStars(610, 380, 10, ["#FFE156", "#FFFFFF"]);
        }
      } else if (cue.subStage === "ninja") {
        if (cue.tag === "freeze") {
          this.vis.ninjaFrozen = true;
          this.vis.ninjaMonitorAlert = 1.0;
          this.cam.zoom.target = 1.06;
          this.particles.spawnComicText(640, 290, "멈춰!!", "#FF5D8F", 52, 0.7);
        } else if (cue.tag === "go") {
          this.vis.ninjaFrozen = false;
          this.cam.zoom.target = 1.0;
        } else if (cue.tag === "lights_out") {
          this.cam.blackoutTarget = 1;
          this.particles.spawnComicText(640, 260, "암전! 리듬을 믿어!", "#72EFDD", 40, 0.9);
        } else if (cue.tag === "lights_on") {
          this.cam.blackoutTarget = 0;
          this.cam.flash(0.5, "#FFF9D6");
        } else if (cue.tag === "door_zoom") {
          this.cam.panTo(0, -60, 1.24, 0);
        }
      }
    }
  }

  // ===== JUDGEMENT ENGINE (TAP / HOLD / RELEASE / REST) =====
  _onActionPress() {
    this.holdingDown = true;

    if (this.state === "PRACTICE" && this.practicePhase === "live") {
      this._judgePracticeTap();
      return;
    }
    if (this.state !== "PLAY" || this.paused || this.finishTriggered) return;

    const spb = 60 / this.stage.bpm;
    const nowT = this.audio.now() - (this.audio.offsetMs / 1000);
    const hitBeat = (nowT - this.songStartTime) / spb;

    // 1. Check if player violated a REST guard!
    for (const ev of this.chart.events) {
      if (!ev.judged && ev.type === "rest") {
        const dtSec = (hitBeat - ev.beat) * spb;
        if (Math.abs(dtSec) <= 0.22) {
          ev.judged = true;
          ev.grade = "miss";
          this._onJudgeResult(ev, "miss", dtSec * 1000, true);
          return;
        }
      }
    }

    // 2. Find nearest unjudged TAP or HOLD event within hit window
    let best = null;
    let bestAbs = Infinity;
    let bestDt = 0;
    for (const ev of this.chart.events) {
      if (ev.judged) continue;
      if (ev.type !== "tap" && ev.type !== "hold") continue;
      const dtSec = (hitBeat - ev.beat) * spb;
      const abs = Math.abs(dtSec);
      if (abs < bestAbs && abs <= 0.165) {
        bestAbs = abs;
        best = ev;
        bestDt = dtSec;
      }
    }

    // Immediate tactile visual hand reaction regardless of hit
    this.vis.dadHand.kick(14);

    if (!best) {
      // Stray tap visual feedback (small swoosh/tap without harshly punishing unless rest violation)
      this.audio.playCue("woodblock");
      return;
    }

    best.judged = true;
    const grade = bestAbs <= 0.062 ? "perfect" : bestAbs <= 0.125 ? "good" : "miss";
    best.grade = grade;

    if (best.type === "hold" && grade !== "miss") {
      this.vis.holding = true;
      this.activeHoldEv = best;
    }
    this._onJudgeResult(best, grade, bestDt * 1000, false);
  }

  _onActionRelease() {
    if (!this.holdingDown) return;
    this.holdingDown = false;
    this.vis.holding = false;

    if (this.state !== "PLAY" || this.paused || this.finishTriggered) return;
    const spb = 60 / this.stage.bpm;
    const nowT = this.audio.now() - (this.audio.offsetMs / 1000);
    const relBeat = (nowT - this.songStartTime) / spb;

    // Look for nearest unjudged RELEASE event
    let best = null;
    let bestAbs = Infinity;
    let bestDt = 0;
    for (const ev of this.chart.events) {
      if (ev.judged || ev.type !== "release") continue;
      const dtSec = (relBeat - ev.beat) * spb;
      const abs = Math.abs(dtSec);
      if (abs < bestAbs && abs <= 0.185) {
        bestAbs = abs;
        best = ev;
        bestDt = dtSec;
      }
    }
    if (best) {
      best.judged = true;
      const grade = bestAbs <= 0.078 ? "perfect" : bestAbs <= 0.145 ? "good" : "miss";
      best.grade = grade;
      this._onJudgeResult(best, grade, bestDt * 1000, false);
    }
  }

  _judgePracticeTap() {
    const nowT = this.audio.now();
    this.vis.dadHand.kick(14);
    let hit = null;
    let bestAbs = Infinity;
    for (const ev of this.practiceEvents) {
      if (ev.judged) continue;
      const abs = Math.abs(nowT - ev.time);
      if (abs < bestAbs && abs <= 0.18) {
        bestAbs = abs;
        hit = ev;
      }
    }
    if (!hit) {
      this.audio.playCue("miss_bonk");
      return;
    }
    hit.judged = true;
    this.practiceSuccess++;
    this.vis.babyBounce.kick(-8);
    if (this.stage.id === "pacifier") {
      this.audio.playCue("dad_catch");

      this.audio.playCue("pat_todak");
      this.particles.spawnComicText(760, 360, "토닥!", "#FFE156", 44);
    } else if (this.stage.id === "photo") {
      this.audio.playCue("shutter_snap");
      this.cam.flash(0.6, "#FFFFFF");
      this.particles.spawnComicText(640, 290, "찰칵! 최고!", "#FFE156", 44);
    } else {
      this.audio.playCue("ninja_step");
      this.vis.ninjaSteps++;
      this.particles.spawnComicText(640, 350, "살금!", "#72EFDD", 44);
    }
    this.particles.burstStars(640, 360, 12);
    this.cam.hitPunch(0.05);

    if (this.practiceSuccess >= this.practiceTargetSuccess) {
      this.practicePhase = "ready";
      this.audio.playCue("skill_star_hit");
      this.particles.spawnComicText(640, 330, "OK!! 실전 시작! ♪", "#FFE156", 60, 1.3);
      setTimeout(() => {
        if (this.state === "PRACTICE") this.startMainPlay();
      }, 1150);
    }
  }

  _onJudgeResult(ev, grade, deltaMs, restViolation) {
    this.lastDeltaMs = Math.round(deltaMs);
    const sub = ev.subStage || this.activeSubStage;

    // Close Skill Star drama bars right after its event resolves
    if (ev.skillStar) {
      this.vis.skillStarActive = false;
      this.cam.cinemaBarsTarget = 0;
      this.cam.zoom.target = 1;
    }

    if (grade === "perfect" || grade === "good") {
      if (grade === "perfect") this.perfectCount++;
      else this.goodCount++;
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      this.vis.fever = clamp(this.combo / 12, 0, 1);

      if (ev.sfx) this.audio.playCue(ev.sfx);
      if (grade === "good") this.audio.playCue("barely_wobble");

      // SKILL STAR EXPLOSION!!
      if (ev.skillStar && grade === "perfect") {
        this.skillStarGot = true;
        this.vis.skillStarBanner = 2.0;
        this.audio.playCue("skill_star_hit");
        this.cam.flash(0.68, "#FFF4B0");
        this.cam.hitPunch(0.11);
        this.particles.burstStars(640, 340, 26, ["#FFE156", "#FFFFFF", "#FF6B8B", "#7CE8FF"], 420);
        this.particles.spawnComicText(640, 175, "★ 스킬 스타 획득!! ★", "#FFE156", 54, 1.4);
      } else {
        this.cam.hitPunch(grade === "perfect" ? 0.055 : 0.025);
      }

      // Stage-specific joyful reactions!
      if (sub === "pacifier") {
        for (const p of this.vis.pacifiers) {
          if (!p.done && Math.abs(p.targetBeat - ev.beat) < 0.4) p.done = true;
        }
        this.vis.babyExpr = grade === "perfect" ? "bliss" : "happy";
        this.vis.babyExprTimer = 0.55;
        this.vis.dadExpr = "happy"; this.vis.dadExprTimer = 0.5;
        this.vis.babyBounce.kick(-9);
        this.particles.spawnRing(670, 355, grade === "perfect" ? "#FFE156" : "#7CE8FF", 130, 9);
        this.particles.burstStars(670, 355, grade === "perfect" ? 14 : 7);
        this.particles.spawnComicText(660, 255, grade === "good" ? "아슬!" : ev.comic, grade === "perfect" ? "#FFE156" : "#7CE8FF", 46);
        this.cam.zoom.target = 1;
      } else if (sub === "burp") {
        this.vis.babyBounce.kick(-8);
        if (ev.type === "release") {
          this.vis.babyExpr = "burp_boom"; this.vis.babyExprTimer = 0.9;
          this.vis.babyBelly.target = 0;
          this.cam.zoom.target = 1;
          this.cam.shake(0.32);
          for (let i = 0; i < 6; i++) this.particles.spawnBubble(680 + rand(-40, 40), 390, rand(18, 36), rand(-120, 120), rand(-220, -110));
          this.particles.burstNotes(680, 370, 8, "#FFE156");
          this.particles.spawnComicText(680, 240, ev.comic, "#FFE156", 58);
        } else if (ev.type === "rest") {
          this.vis.babyExpr = "sleepy"; this.vis.babyExprTimer = 0.7;
          this.cam.vignetteTarget = 0.14;
          this.cam.zoom.target = 1;
          this.particles.spawnComicText(680, 260, "Zzz... ♪", "#B5F8FF", 38);
        } else {
          this.particles.spawnRing(785, 445, "#FFE156", 90, 7);
          this.particles.spawnComicText(810, 370, ev.comic, "#FFE885", 40);
        }
      } else if (sub === "photo") {
        this.cam.flash(0.72, "#FFFFFF");
        this.vis.babyExpr = "sparkle"; this.vis.babyExprTimer = 0.65;
        this.vis.dadExpr = "thumbsup"; this.vis.dadExprTimer = 0.75;
        this.vis.sleepyDad = false;
        this.vis.babyBounce.kick(-9);
        this.vis.photoSnapshots.push({
          x: this.vis.photoSnapshots.length % 2 === 0 ? 310 + rand(-40, 40) : 960 + rand(-40, 40),
          y: 250 + rand(-30, 30),
          rot: rand(-0.22, 0.22), good: true, label: grade === "perfect" ? "인생샷!" : "좋아요!", age: 0,
        });
        if (this.vis.photoSnapshots.length > 3) this.vis.photoSnapshots.shift();
        this.particles.burstStars(610, 380, 12);
        this.particles.spawnComicText(620, 230, ev.comic, "#FFE156", 48);
        this.cam.panTo(0, 0, 1, 0);
      } else if (sub === "ninja") {
        if (ev.meta && ev.meta.kind === "door") {
          this.vis.ninjaDoorOpen = 1;
          this.vis.dadExpr = "thumbsup"; this.vis.dadExprTimer = 3;
          this.cam.godRaysTarget = 1;
          this.cam.flash(0.8, "#FFF4B0");
          this.particles.spawnConfetti(640, 300, 45, 480);
          this.particles.spawnComicText(640, 220, ev.comic, "#FFE156", 58, 1.3);

          this.vis.dadExpr = "focus"; this.vis.dadExprTimer = 0.35;

    } else {
