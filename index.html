<script>
"use strict";
(() => {
/* ===== src/math.js ===== */
// Core math, spring physics, color utilities, and juicy motion-graphics particles

const W = 1280;
const H = 720;
const INK = "#26192C";
const FONT_MAIN = '"Jua", "Outfit", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const FONT_NUM = '"Outfit", "Jua", sans-serif';

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function invLerp(a, b, v) {
  return a === b ? 0 : (v - a) / (b - a);
}
function smoothstep(t) {
  const x = clamp(t, 0, 1);
  return x * x * (3 - 2 * x);
}
function rand(lo, hi) {
  return lo + Math.random() * (hi - lo);
}
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

const Ease = {
  outQuad: (t) => 1 - (1 - clamp(t, 0, 1)) ** 2,
  inQuad: (t) => clamp(t, 0, 1) ** 2,
  outCubic: (t) => 1 - (1 - clamp(t, 0, 1)) ** 3,
  inOutCubic: (t) => {
    const x = clamp(t, 0, 1);
    return x < 0.5 ? 4 * x * x * x : 1 - ((-2 * x + 2) ** 3) / 2;
  },
  outExpo: (t) => {
    const x = clamp(t, 0, 1);
    return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  },
  outBack: (t, s = 1.70158) => {
    const x = clamp(t, 0, 1) - 1;
    return 1 + (s + 1) * x * x * x + s * x * x;
  },
  outElastic: (t) => {
    const x = clamp(t, 0, 1);
    if (x === 0 || x === 1) return x;
    return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
  },
  outBounce: (t) => {
    let x = clamp(t, 0, 1);
    const n1 = 7.5625, d1 = 2.75;
    if (x < 1 / d1) return n1 * x * x;
    if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
    if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
    return n1 * (x -= 2.625 / d1) * x + 0.984375;
  },
};

function hexToRgb(hex) {
  if (Array.isArray(hex)) return hex;
  if (typeof hex === "string" && hex.startsWith("rgb")) {
    const m = hex.match(/\d+/g);
    if (m && m.length >= 3) return [Number(m[0]), Number(m[1]), Number(m[2])];
  }
  const h = String(hex).replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function lerpHex(hexA, hexB, t) {
  const a = hexToRgb(hexA);
  const b = hexToRgb(hexB);
  const k = clamp(t, 0, 1);
  const r = Math.round(lerp(a[0], b[0], k));
  const g = Math.round(lerp(a[1], b[1], k));
  const bl = Math.round(lerp(a[2], b[2], k));
  return `rgb(${r},${g},${bl})`;
}

// Real damped harmonic spring for organic squash/stretch & UI overshoot
class Spring {
  constructor(val = 0, stiffness = 260, damping = 18) {
    this.val = val;
    this.target = val;
    this.vel = 0;
    this.stiffness = stiffness;
    this.damping = damping;
  }
  set(v) {
    this.val = v;
    this.target = v;
    this.vel = 0;
  }
  kick(impulse) {
    this.vel += impulse;
  }
  update(dt) {
    const step = Math.min(dt, 0.05);
    const force = (this.target - this.val) * this.stiffness;
    const damp = -this.vel * this.damping;
    this.vel += (force + damp) * step;
    this.val += this.vel * step;
    return this.val;
  }
}

// Motion-graphics particle & comic pop-text system
class ParticleSystem {
  constructor() {
    this.items = [];
  }
  clear() {
    this.items.length = 0;
  }
  burstStars(x, y, count = 14, colors = ["#FFE156", "#FF8FA3", "#7CE8FF", "#FFFFFF"], speed = 280) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + rand(-0.22, 0.22);
      const sp = rand(speed * 0.45, speed * 1.15);
      this.items.push({
        kind: "star",
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - rand(20, 90),
        rot: rand(0, Math.PI * 2),
        vrot: rand(-8, 8),
        size: rand(9, 20),
        color: colors[i % colors.length],
        life: 0,
        maxLife: rand(0.45, 0.85),
        gravity: 340,
      });
    }
  }
  burstNotes(x, y, count = 6, color = "#FFE156") {
    const glyphs = ["♪", "♫", "★", "✦"];
    for (let i = 0; i < count; i++) {
      this.items.push({
        kind: "glyph",
        glyph: glyphs[i % glyphs.length],
        x: x + rand(-24, 24),
        y: y + rand(-18, 12),
        vx: rand(-110, 110),
        vy: rand(-210, -90),
        rot: rand(-0.4, 0.4),
        vrot: rand(-2.2, 2.2),
        size: rand(24, 38),
        color,
        life: 0,
        maxLife: rand(0.65, 1.05),
        gravity: 90,
      });
    }
  }
  spawnRing(x, y, color = "#FFE156", maxR = 130, lineWidth = 10, maxLife = 0.42) {
    this.items.push({
      kind: "ring",
      x, y,
      color,
      r0: 14,
      r1: maxR,
      lw: lineWidth,
      life: 0,
      maxLife,
    });
  }
  spawnBubble(x, y, r = 24, vx = 0, vy = -120) {
    this.items.push({
      kind: "bubble",
      x, y, vx, vy, r,
      wobble: rand(0, Math.PI * 2),
      life: 0,
      maxLife: rand(0.9, 1.5),
    });
  }
  spawnComicText(x, y, text, color = "#FFE156", size = 46, maxLife = 0.62) {
    this.items.push({
      kind: "comic",
      x, y,
      vy: -65,
      text,
      color,
      size,
      rot: rand(-0.16, 0.16),
      life: 0,
      maxLife,
    });
  }
  spawnConfetti(x, y, count = 36, spread = 460) {
    const palette = ["#FF6B8B", "#FFD93D", "#6BCB77", "#4D96FF", "#C77DFF", "#FF9F1C", "#FFFFFF"];
    for (let i = 0; i < count; i++) {
      const ang = rand(-Math.PI * 0.95, -Math.PI * 0.05);
      const sp = rand(spread * 0.35, spread);
      this.items.push({
        kind: "confetti",
        x: x + rand(-80, 80),
        y: y + rand(-30, 30),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - rand(40, 160),
        w: rand(10, 18),
        h: rand(6, 11),
        rot: rand(0, Math.PI * 2),
        vrot: rand(-10, 10),
        color: palette[i % palette.length],
        life: 0,
        maxLife: rand(1.1, 2.0),
        gravity: 420,
      });
    }
  }
  spawnSweat(x, y) {
    for (let i = 0; i < 3; i++) {
      this.items.push({
        kind: "sweat",
        x: x + rand(-18, 18),
        y: y + rand(-10, 10),
        vx: (i - 1) * 95 + rand(-20, 20),
        vy: -130 - rand(0, 60),
        size: rand(10, 15),
        life: 0,
        maxLife: 0.55,
        gravity: 480,
      });
    }
  }
  update(dt) {
    const step = Math.min(dt, 0.05);
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life += step;
      if (p.life >= p.maxLife) {
        this.items.splice(i, 1);
        continue;
      }
      if (p.vx !== undefined) p.x += p.vx * step;
      if (p.vy !== undefined) p.y += p.vy * step;
      if (p.gravity) p.vy += p.gravity * step;
      if (p.vrot) p.rot += p.vrot * step;
      if (p.kind === "bubble") {
        p.wobble += step * 7;
        p.x += Math.sin(p.wobble) * 32 * step;
      }
      if (p.kind === "confetti") {
        p.vx *= 0.985;
      }
    }
  }
  draw(ctx) {
    for (const p of this.items) {
      const t = p.life / p.maxLife;
      const alpha = t < 0.72 ? 1 : 1 - (t - 0.72) / 0.28;
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      if (p.kind === "star") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const s = p.size * (1 - t * 0.45);
        drawStarPath(ctx, 0, 0, 5, s, s * 0.45);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = INK;
        ctx.stroke();
      } else if (p.kind === "glyph") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sc = t < 0.18 ? Ease.outBack(t / 0.18) : 1 - t * 0.18;
        ctx.scale(sc, sc);
        ctx.font = `900 ${p.size}px ${FONT_MAIN}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 5;
        ctx.strokeStyle = INK;
        ctx.strokeText(p.glyph, 0, 0);
        ctx.fillStyle = p.color;
        ctx.fillText(p.glyph, 0, 0);
      } else if (p.kind === "ring") {
        const r = lerp(p.r0, p.r1, Ease.outCubic(t));
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1.5, p.lw * (1 - t));
        ctx.stroke();
      } else if (p.kind === "bubble") {
        const sc = t < 0.15 ? Ease.outBack(t / 0.15) : 1 + Math.sin(p.wobble) * 0.05;
        ctx.translate(p.x, p.y);
        ctx.scale(sc, sc);
        const g = ctx.createRadialGradient(-p.r * 0.3, -p.r * 0.3, 2, 0, 0, p.r);
        g.addColorStop(0, "rgba(255,255,255,0.85)");
        g.addColorStop(0.5, "rgba(180,240,255,0.38)");
        g.addColorStop(0.85, "rgba(255,180,235,0.45)");
        g.addColorStop(1, "rgba(255,255,255,0.75)");
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-p.r * 0.32, -p.r * 0.32, p.r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fill();
      } else if (p.kind === "comic") {
        const sc = t < 0.2 ? Ease.outBack(t / 0.2, 2.4) : 1;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(sc, sc);
        ctx.font = `900 ${p.size}px ${FONT_MAIN}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = 9;
        ctx.strokeStyle = INK;
        ctx.strokeText(p.text, 0, 0);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, 0, 0);
      } else if (p.kind === "confetti") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.life * 11));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w * 0.5, -p.h * 0.5, p.w, p.h);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = INK;
        ctx.strokeRect(-p.w * 0.5, -p.h * 0.5, p.w, p.h);
      } else if (p.kind === "sweat") {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI * 0.5);
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size * 0.75, 0, 0, p.size * 0.8);
        ctx.quadraticCurveTo(-p.size * 0.75, 0, 0, -p.size);
        ctx.fillStyle = "#7CE8FF";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = INK;
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawStarPath(ctx, cx, cy, spikes, outerR, innerR) {
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  ctx.beginPath();
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.closePath();
}


/* ===== src/camera.js ===== */
// Virtual 2D Cinema Camera Rig — beat-synced zoom, dolly, whip-pan, Dutch tilt,
// blackout spotlight, volumetric god-rays, iris wipe, flash, and vignette.

class CameraRig {
  constructor() {
    this.x = new Spring(0, 150, 18);
    this.y = new Spring(0, 150, 18);
    this.zoom = new Spring(1, 210, 19);
    this.angle = new Spring(0, 220, 16);
    this.trauma = 0;
    this.flashAlpha = 0;
    this.flashColor = "#FFFFFF";
    this.vignette = 0;
    this.vignetteTarget = 0.14;
    this.vignetteColor = "rgba(18, 10, 32,";
    this.blackout = 0;
    this.blackoutTarget = 0;
    this.desat = 0;
    this.iris = 1.6; // >1.4 = fully open, 0 = fully closed
    this.irisTarget = 1.6;
    this.irisCx = W * 0.5;
    this.irisCy = H * 0.5;
    this.godRays = 0;
    this.godRaysTarget = 0;
    this.godRaysRainbow = false;
    this.cinemaBars = 0;
    this.cinemaBarsTarget = 0;
    this.swayAmp = 0;
    this.swayPhase = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.time = 0;
  }

  reset() {
    this.x.set(0);
    this.y.set(0);
    this.zoom.set(1);
    this.angle.set(0);
    this.trauma = 0;
    this.flashAlpha = 0;
    this.vignette = 0.14;
    this.vignetteTarget = 0.14;
    this.vignetteColor = "rgba(18, 10, 32,";
    this.blackout = 0;
    this.blackoutTarget = 0;
    this.desat = 0;
    this.iris = 1.6;
    this.irisTarget = 1.6;
    this.irisCx = W * 0.5;
    this.irisCy = H * 0.5;
    this.godRays = 0;
    this.godRaysTarget = 0;
    this.godRaysRainbow = false;
    this.cinemaBars = 0;
    this.cinemaBarsTarget = 0;
    this.swayAmp = 0;
  }

  panTo(tx, ty, zoom = 1, angle = 0) {
    this.x.target = tx;
    this.y.target = ty;
    this.zoom.target = zoom;
    this.angle.target = angle;
  }

  snapTo(tx, ty, zoom = 1, angle = 0) {
    this.x.set(tx);
    this.y.set(ty);
    this.zoom.set(zoom);
    this.angle.set(angle);
  }

  beatPulse(strength = 0.025) {
    this.zoom.kick(strength * 14);
  }

  hitPunch(strength = 0.06, roll = 0) {
    this.zoom.kick(strength * 20);
    if (roll) this.angle.kick(roll);
  }

  missKick() {
    this.trauma = Math.min(1, this.trauma + 0.52);
    this.angle.kick((Math.random() < 0.5 ? -1 : 1) * 0.85);
    this.zoom.kick(-1.0);
    this.desat = 0.85;
  }

  shake(amount = 0.45) {
    this.trauma = Math.min(1, this.trauma + amount);
  }

  flash(alpha = 0.85, color = "#FFFFFF") {
    this.flashAlpha = Math.max(this.flashAlpha, alpha);
    this.flashColor = color;
  }

  update(dt) {
    const step = Math.min(dt, 0.05);
    this.time += step;
    this.x.update(step);
    this.y.update(step);
    this.zoom.update(step);
    this.angle.update(step);
    this.trauma = Math.max(0, this.trauma - step * 2.4);
    const sh = this.trauma * this.trauma;
    this.shakeX = Math.sin(this.time * 67) * 20 * sh;
    this.shakeY = Math.cos(this.time * 83) * 16 * sh;
    this.flashAlpha = Math.max(0, this.flashAlpha - step * 2.9);
    this.desat = Math.max(0, this.desat - step * 2.3);
    this.vignette = lerp(this.vignette, this.vignetteTarget, 1 - Math.exp(-step * 6));
    this.blackout = lerp(this.blackout, this.blackoutTarget, 1 - Math.exp(-step * 12));
    this.iris = lerp(this.iris, this.irisTarget, 1 - Math.exp(-step * 5.5));
    this.godRays = lerp(this.godRays, this.godRaysTarget, 1 - Math.exp(-step * 4.5));
    this.cinemaBars = lerp(this.cinemaBars, this.cinemaBarsTarget, 1 - Math.exp(-step * 8));
  }

  applyWorld(ctx) {
    ctx.save();
    const sway = this.swayAmp ? Math.sin(this.swayPhase) * this.swayAmp : 0;
    const z = clamp(this.zoom.val, 0.55, 2.2);
    ctx.translate(W * 0.5 + this.shakeX, H * 0.5 + this.shakeY);
    ctx.rotate(this.angle.val + sway);
    ctx.scale(z, z);
    ctx.translate(-W * 0.5 - this.x.val, -H * 0.5 - this.y.val);
  }

  endWorld(ctx) {
    ctx.restore();
  }

  drawPostFX(ctx, blackoutCutouts = null) {
    // Brief desaturation overlay on misses
    if (this.desat > 0.02) {
      ctx.save();
      ctx.fillStyle = `rgba(38, 30, 56, ${this.desat * 0.28})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Volumetric Climax God-Rays
    if (this.godRays > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const ox = W * 0.78;
      const oy = -80;
      const rays = 9;
      for (let i = 0; i < rays; i++) {
        const baseA = 0.52 + i * 0.22 + Math.sin(this.time * 0.9 + i) * 0.04;
        const spread = 0.085 + (i % 2) * 0.04;
        const len = 1450;
        const grad = ctx.createLinearGradient(ox, oy, ox - Math.cos(baseA) * len, oy + Math.sin(baseA) * len);
        if (this.godRaysRainbow) {
          const hue = (i * 42 + this.time * 55) % 360;
          grad.addColorStop(0, `hsla(${hue}, 95%, 74%, ${0.42 * this.godRays})`);
          grad.addColorStop(0.6, `hsla(${(hue + 35) % 360}, 95%, 68%, ${0.16 * this.godRays})`);
          grad.addColorStop(1, "rgba(255,255,255,0)");
        } else {
          grad.addColorStop(0, `rgba(255, 242, 178, ${0.46 * this.godRays})`);
          grad.addColorStop(0.55, `rgba(255, 224, 130, ${0.18 * this.godRays})`);
          grad.addColorStop(1, "rgba(255, 240, 200, 0)");
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox - Math.cos(baseA - spread) * len, oy + Math.sin(baseA - spread) * len);
        ctx.lineTo(ox - Math.cos(baseA + spread) * len, oy + Math.sin(baseA + spread) * len);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Blackout blind-beat stealth darkness with optional glowing eyes
    if (this.blackout > 0.01) {
      ctx.save();
      ctx.fillStyle = `rgba(8, 6, 18, ${clamp(this.blackout * 0.96, 0, 0.96)})`;
      ctx.fillRect(0, 0, W, H);
      if (blackoutCutouts) blackoutCutouts(ctx, this.blackout);
      ctx.restore();
    }

    // Vignette
    if (this.vignette > 0.01) {
      ctx.save();
      const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.34, W * 0.5, H * 0.5, W * 0.68);
      vg.addColorStop(0, `${this.vignetteColor} 0)`);
      vg.addColorStop(1, `${this.vignetteColor} ${clamp(this.vignette, 0, 0.85)})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Widescreen cinema bars for Skill Star / dramatic moments
    if (this.cinemaBars > 0.01) {
      const barH = 44 * this.cinemaBars;
      ctx.fillStyle = "#120B1F";
      ctx.fillRect(0, 0, W, barH);
      ctx.fillRect(0, H - barH, W, barH);
    }

    // Flash overlay
    if (this.flashAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = clamp(this.flashAlpha, 0, 1);
      ctx.fillStyle = this.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Cartoon circular iris wipe
    if (this.iris < 1.38) {
      const r = Math.max(0, this.iris * 820);
      ctx.save();
      ctx.fillStyle = "#140D24";
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(this.irisCx, this.irisCy, r, 0, Math.PI * 2, true);
      ctx.fill("evenodd");
      ctx.restore();
    }
  }
}


/* ===== src/audio.js ===== */
// Studio-Grade WebAudio Engine
// - Sample-accurate lookahead clock anchored strictly to AudioContext.currentTime
// - Mastering chain: Highpass -> Soft Warmth Saturator -> Compressor -> Limiter + Stereo Room Reverb
// - Sidechain Ducking so vocal/rhythm cues ALWAYS shine over the arrangement
// - 3-Formant Phonetic Vocal Synthesizer for unmistakable cute/comedic Korean parenting cues
// - Bespoke multi-track band arrangements for Title, Menu, 5 Title Cards, Practice, 5 Full Stages, & 3 Looping Epilogues

function midiToHz(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

class StudioAudio {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.masterVol = 0.86;
    this.musicVol = 0.85;
    this.sfxVol = 0.95;
    this.offsetMs = 0; // Audio calibration offset
    this.noiseBuf = null;
    this.reverbNode = null;

    // Active background loop (Title / Menu / Practice / Epilogue)
    this.loopTimer = null;
    this.loopKind = null;
    this.loopBpm = 116;
    this.loopStartTime = 0;
    this.loopStep = 0;
    this.loopSubStage = "pacifier";
  }

  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: "interactive" });
      this._buildGraph();
    }
    if (this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
    this.ready = true;
    return this.ctx;
  }

  now() {
    return this.ctx ? this.ctx.currentTime : performance.now() / 1000;
  }

  _buildGraph() {
    const c = this.ctx;
    this.masterGain = c.createGain();
    this.masterGain.gain.value = this.masterVol;

    // Highpass to keep low end tight
    const hp = c.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 34;

    // Subtle analog warmth waveshaper
    const sat = c.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 255 - 1;
      curve[i] = Math.tanh(x * 1.25) / Math.tanh(1.25);
    }
    sat.curve = curve;

    // Bus glue compressor + peak limiter
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 14;
    comp.ratio.value = 3.2;
    comp.attack.value = 0.006;
    comp.release.value = 0.14;

    const lim = c.createDynamicsCompressor();
    lim.threshold.value = -2.2;
    lim.knee.value = 2;
    lim.ratio.value = 18;
    lim.attack.value = 0.001;
    lim.release.value = 0.06;

    // Buses
    this.musicBus = c.createGain();
    this.musicBus.gain.value = this.musicVol;
    this.duckGain = c.createGain();
    this.duckGain.gain.value = 1.0;

    this.cueBus = c.createGain();
    this.cueBus.gain.value = this.sfxVol * 1.15;
    const cueEQ = c.createBiquadFilter();
    cueEQ.type = "highshelf";
    cueEQ.frequency.value = 2600;
    cueEQ.gain.value = 2.5;

    this.sfxBus = c.createGain();
    this.sfxBus.gain.value = this.sfxVol;

    // Procedural silky stereo room impulse response for ConvolverNode
    this.reverbSend = c.createGain();
    this.reverbSend.gain.value = 0.22;
    this.reverbNode = c.createConvolver();
    this.reverbNode.buffer = this._makeRoomIR(1.15, 2.8);

    this.musicBus.connect(this.duckGain);
    this.duckGain.connect(hp);
    this.duckGain.connect(this.reverbSend);

    this.cueBus.connect(cueEQ);
    cueEQ.connect(hp);
    cueEQ.connect(this.reverbSend);

    this.sfxBus.connect(hp);

    this.reverbSend.connect(this.reverbNode);
    this.reverbNode.connect(hp);

    hp.connect(sat);
    sat.connect(comp);
    comp.connect(lim);
    lim.connect(this.masterGain);
    this.masterGain.connect(c.destination);

    // Pre-generate crisp white noise buffer (2s)
    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const ch = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  }

  _makeRoomIR(duration, decay) {
    const c = this.ctx;
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const env = Math.pow(1 - t, decay);
        const n = (Math.random() * 2 - 1) * env;
        lp = lp * 0.72 + n * 0.28; // warm low-pass room tail
        data[i] = lp * (i < 480 ? i / 480 : 1);
      }
    }
    return buf;
  }

  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.masterGain.gain.setTargetAtTime(this.masterVol, t, 0.02);
    this.musicBus.gain.setTargetAtTime(this.musicVol, t, 0.02);
    this.cueBus.gain.setTargetAtTime(this.sfxVol * 1.15, t, 0.02);
    this.sfxBus.gain.setTargetAtTime(this.sfxVol, t, 0.02);
  }

  duck(time, depth = 0.62, dur = 0.2) {
    if (!this.ctx) return;
    const t = Math.max(this.ctx.currentTime, Number.isFinite(time) ? time : this.ctx.currentTime);
    const g = this.duckGain.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(1.0, t);
    g.linearRampToValueAtTime(depth, t + 0.015);
    g.exponentialRampToValueAtTime(1.0, t + dur);
  }

  _safeTime(t) {
    const now = this.ctx ? this.ctx.currentTime : 0;
    return Math.max(now, Number.isFinite(t) ? t : now);
  }

  // ===== STUDIO DRUMS & PERCUSSION =====
  kick(t, vel = 0.85, pitch = 135) {
    t = this._safeTime(t);
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(pitch, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.085);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.22);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vel * 0.9, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
    o.connect(g);
    g.connect(this.musicBus);
    o.start(t);
    o.stop(t + 0.28);
    // Beater click
    const cl = c.createOscillator();
    const cg = c.createGain();
    cl.type = "triangle";
    cl.frequency.setValueAtTime(950, t);
    cl.frequency.exponentialRampToValueAtTime(140, t + 0.018);
    cg.gain.setValueAtTime(vel * 0.22, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    cl.connect(cg);
    cg.connect(this.musicBus);
    cl.start(t);
    cl.stop(t + 0.025);
  }

  snare(t, vel = 0.65, tone = 195) {
    const c = this.ctx;
    // Snare wires
    const n = c.createBufferSource();
    n.buffer = this.noiseBuf;
    const hp = c.createBiquadFilter();
    hp.type = "bandpass";
    hp.frequency.value = 2400;
    hp.Q.value = 0.7;
    const ng = c.createGain();
    ng.gain.setValueAtTime(vel * 0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    n.connect(hp);
    hp.connect(ng);
    ng.connect(this.musicBus);
    n.start(t);
    n.stop(t + 0.18);
    // Snare body
    const o = c.createOscillator();
    const og = c.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(tone, t);
    o.frequency.exponentialRampToValueAtTime(115, t + 0.08);
    og.gain.setValueAtTime(vel * 0.45, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    o.connect(og);
    og.connect(this.musicBus);
    o.start(t);
    o.stop(t + 0.12);
  }

  hat(t, vel = 0.26, open = false) {
    const c = this.ctx;
    const n = c.createBufferSource();
    n.buffer = this.noiseBuf;
    const hp = c.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = open ? 6800 : 8400;
    const g = c.createGain();
    const dur = open ? 0.24 : 0.055;
    g.gain.setValueAtTime(vel * 0.42, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(hp);
    hp.connect(g);
    g.connect(this.musicBus);
    n.start(t);
    n.stop(t + dur + 0.02);
  }

  clap(t, vel = 0.52, bus = null) {
    const c = this.ctx;
    const dest = bus || this.musicBus;
    for (let i = 0; i < 3; i++) {
      const dt = i * 0.011;
      const n = c.createBufferSource();
      n.buffer = this.noiseBuf;
      const bp = c.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1550 + i * 220;
      bp.Q.value = 1.6;
      const g = c.createGain();
      g.gain.setValueAtTime(vel * (i === 2 ? 0.55 : 0.34), t + dt);
      g.gain.exponentialRampToValueAtTime(0.001, t + dt + (i === 2 ? 0.14 : 0.04));
      n.connect(bp);
      bp.connect(g);
      g.connect(dest);
      n.start(t + dt);
      n.stop(t + dt + 0.16);
    }
  }

  woodblock(t, midi = 76, vel = 0.45, bus = null) {
    const c = this.ctx;
    const dest = bus || this.musicBus;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    const f = midiToHz(midi);
    o.frequency.setValueAtTime(f * 1.15, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.012);
    g.gain.setValueAtTime(vel * 0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g);
    g.connect(dest);
    o.start(t);
    o.stop(t + 0.08);
  }

  crash(t, vel = 0.35) {
    const c = this.ctx;
    const n = c.createBufferSource();
    n.buffer = this.noiseBuf;
    const hp = c.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 4800;
    const g = c.createGain();
    g.gain.setValueAtTime(vel * 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.72);
    n.connect(hp);
    hp.connect(g);
    g.connect(this.musicBus);
    n.start(t);
    n.stop(t + 0.75);
  }

  // ===== STUDIO MELODIC INSTRUMENTS =====
  bass(t, midi, dur = 0.25, vel = 0.55, style = "funk") {
    const c = this.ctx;
    const f = midiToHz(midi);
    const o = c.createOscillator();
    const sub = c.createOscillator();
    o.type = style === "upright" ? "triangle" : "sawtooth";
    sub.type = "sine";
    o.frequency.setValueAtTime(f, t);
    sub.frequency.setValueAtTime(f, t);
    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(style === "funk" ? f * 6.5 : f * 3.5, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.7, t + Math.min(0.14, dur));
    lp.Q.value = style === "funk" ? 3.2 : 1.0;
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vel * 0.52, t + 0.008);
    g.gain.setTargetAtTime(vel * 0.34, t + 0.04, 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.05);
    o.connect(lp);
    sub.connect(g);
    lp.connect(g);
    g.connect(this.musicBus);
    o.start(t);
    sub.start(t);
    o.stop(t + dur + 0.07);
    sub.stop(t + dur + 0.07);
  }

  rhodes(t, midis, dur = 0.4, vel = 0.26) {
    const c = this.ctx;
    const list = Array.isArray(midis) ? midis : [midis];
    for (const m of list) {
      const f = midiToHz(m);
      const o = c.createOscillator();
      const bell = c.createOscillator();
      o.type = "sine";
      bell.type = "triangle";
      o.frequency.setValueAtTime(f, t);
      bell.frequency.setValueAtTime(f * 4, t);
      const bg = c.createGain();
      bg.gain.setValueAtTime(vel * 0.14, t);
      bg.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
      const g = c.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(vel * 0.32, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.12);
      bell.connect(bg);
      bg.connect(this.musicBus);
      o.connect(g);
      g.connect(this.musicBus);
      o.start(t);
      bell.start(t);
      o.stop(t + dur + 0.14);
      bell.stop(t + 0.11);
    }
  }

  brass(t, midis, dur = 0.24, vel = 0.32, swell = false) {
    const c = this.ctx;
    const list = Array.isArray(midis) ? midis : [midis];
    for (const m of list) {
      const f = midiToHz(m);
      const o1 = c.createOscillator();
      const o2 = c.createOscillator();
      o1.type = "sawtooth";
      o2.type = "sawtooth";
      o1.frequency.setValueAtTime(f * 0.996, t);
      o2.frequency.setValueAtTime(f * 1.004, t);
      const lp = c.createBiquadFilter();
      lp.type = "lowpass";
      if (swell) {
        lp.frequency.setValueAtTime(420, t);
        lp.frequency.exponentialRampToValueAtTime(2800, t + dur * 0.75);
      } else {
        lp.frequency.setValueAtTime(2900, t);
        lp.frequency.exponentialRampToValueAtTime(1150, t + dur);
      }
      lp.Q.value = 1.6;
      const g = c.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(vel * 0.26, t + (swell ? dur * 0.55 : 0.018));
      g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.08);
      o1.connect(lp);
      o2.connect(lp);
      lp.connect(g);
      g.connect(this.musicBus);
      o1.start(t);
      o2.start(t);
      o1.stop(t + dur + 0.1);
      o2.stop(t + dur + 0.1);
    }
  }

  marimba(t, midi, dur = 0.22, vel = 0.36, bus = null) {
    const c = this.ctx;
    const dest = bus || this.musicBus;
    const f = midiToHz(midi);
    const o = c.createOscillator();
    const o2 = c.createOscillator();
    o.type = "sine";
    o2.type = "sine";
    o.frequency.setValueAtTime(f, t);
    o2.frequency.setValueAtTime(f * 3.98, t);
    const g = c.createGain();
    const g2 = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vel * 0.55, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    g2.gain.setValueAtTime(vel * 0.22, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    o.connect(g);
    o2.connect(g2);
    g.connect(dest);
    g2.connect(dest);
    o.start(t);
    o2.start(t);
    o.stop(t + dur + 0.02);
    o2.stop(t + 0.05);
  }

  lead(t, midi, dur = 0.22, vel = 0.26, vibe = "pop") {
    const c = this.ctx;
    const f = midiToHz(midi);
    const o = c.createOscillator();
    o.type = vibe === "celesta" ? "sine" : vibe === "spy" ? "triangle" : "square";
    o.frequency.setValueAtTime(f, t);
    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = vibe === "celesta" ? 5000 : vibe === "spy" ? 1800 : 2400;
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vel * 0.35, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.07);
    o.connect(lp);
    lp.connect(g);
    g.connect(this.musicBus);
    o.start(t);
    o.stop(t + dur + 0.09);
  }

  // ===== 3-FORMANT PHONETIC VOCAL SYNTHESIZER =====
  // Synthesizes cute, expressive vowel-shaped vocalizations + consonant transients
  _formantVoice(t, { f0Start, f0End, dur, formants, gain = 0.42, bus = null, vibrato = 0, nasal = false }) {
    const c = this.ctx;
    const dest = bus || this.cueBus;
    const osc = c.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(f0Start, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, f0End), t + dur);

    if (vibrato > 0) {
      const lfo = c.createOscillator();
      const lg = c.createGain();
      lfo.frequency.value = 6.5;
      lg.gain.value = vibrato;
      lfo.connect(lg);
      lg.connect(osc.frequency);
      lfo.start(t);
      lfo.stop(t + dur + 0.04);
    }

    const env = c.createGain();
    env.gain.setValueAtTime(0.001, t);
    env.gain.linearRampToValueAtTime(gain, t + Math.min(0.025, dur * 0.25));
    env.gain.setValueAtTime(gain * 0.86, t + dur * 0.72);
    env.gain.exponentialRampToValueAtTime(0.001, t + dur);

    for (let i = 0; i < formants.length; i++) {
      const [freq, q, amp] = formants[i];
      const bp = c.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.setValueAtTime(freq, t);
      bp.Q.value = q;
      const fg = c.createGain();
      fg.gain.value = amp;
      osc.connect(bp);
      bp.connect(fg);
      fg.connect(env);
    }

    if (nasal) {
      const nOsc = c.createOscillator();
      const ng = c.createGain();
      nOsc.type = "sine";
      nOsc.frequency.setValueAtTime(f0Start, t);
      nOsc.frequency.exponentialRampToValueAtTime(Math.max(40, f0End), t + dur);
      ng.gain.value = 0.25;
      nOsc.connect(ng);
      ng.connect(env);
      nOsc.start(t);
      nOsc.stop(t + dur + 0.02);
    }

    env.connect(dest);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  _noiseBurst(t, freq, q, dur, gain, bus = null) {
    const c = this.ctx;
    const dest = bus || this.cueBus;
    const n = c.createBufferSource();
    n.buffer = this.noiseBuf;
    const bp = c.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = freq;
    bp.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(bp);
    bp.connect(g);
    g.connect(dest);
    n.start(t);
    n.stop(t + dur + 0.02);
  }

  playCue(kind, time = null) {
    this.ensure();
    const t = this._safeTime(time !== null ? time : this.now());
    this.duck(t, 0.65, 0.2);

    switch (kind) {
      case "baby_puff": // "우웁!" cheek puff
        this._formantVoice(t, {
          f0Start: 370, f0End: 560, dur: 0.16,
          formants: [[380, 5, 1.0], [820, 6, 0.7], [2600, 8, 0.35]],
          gain: 0.55,
        });
        break;
      case "baby_spit": // "퉤!" explosive pacifier spit
        this._noiseBurst(t, 3400, 2.2, 0.045, 0.58);
        this._formantVoice(t + 0.02, {
          f0Start: 640, f0End: 410, dur: 0.14,
          formants: [[520, 4.5, 1.0], [1850, 6, 0.85], [2900, 8, 0.4]],
          gain: 0.62,
        });
        // Elastic launch twang
        this.marimba(t + 0.01, 79, 0.14, 0.42, this.cueBus);
        break;
      case "baby_lob": // Mega slow-mo "에-취~ 퉤!!"
        this._formantVoice(t, {
          f0Start: 420, f0End: 790, dur: 0.38,
          formants: [[580, 5, 1.0], [1900, 6, 0.8], [2800, 8, 0.45]],
          gain: 0.58, vibrato: 12,
        });
        this.marimba(t, 76, 0.14, 0.36, this.cueBus);
        this.marimba(t + 0.18, 83, 0.18, 0.42, this.cueBus);
        break;
      case "dad_catch": { // Juicy suction pop "쫍!"
        const c = this.ctx;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(190, t);
        o.frequency.exponentialRampToValueAtTime(980, t + 0.055);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.68, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
        o.connect(g);
        g.connect(this.sfxBus);
        o.start(t);
        o.stop(t + 0.085);
        this.marimba(t + 0.02, 84, 0.18, 0.42, this.sfxBus);
        break;
      }
      case "pat_todak": // Warm hollow palm pat "토닥!"
        this.woodblock(t, 64, 0.6, this.sfxBus);
        this._noiseBurst(t, 920, 1.4, 0.05, 0.38, this.sfxBus);

  // ===== SCENE BACKGROUND LOOP SEQUENCER (Title / Menu / Practice / Epilogue) =====
  startLoop(kind, bpm = 116, subStage = "pacifier") {
    this.ensure();
    if (this.loopKind === kind && this.loopTimer && this.loopSubStage === subStage) return;
    this.stopLoop();
    this.loopKind = kind;
    this.loopBpm = bpm;
    this.loopSubStage = subStage;
    this.loopStartTime = this.now() + 0.06;
    this.loopStep = 0; // eighth-note steps

    const schedule = () => {
      if (!this.loopKind) return;
      const secPerEighth = 60 / this.loopBpm / 2;
      const horizon = this.now() + 0.16;
      while (this.loopStartTime + this.loopStep * secPerEighth < horizon) {
        const t = this.loopStartTime + this.loopStep * secPerEighth;
        this._playLoopStep(this.loopKind, this.loopStep, t, secPerEighth);
        this.loopStep++;
      }
    };
    schedule();
    this.loopTimer = setInterval(schedule, 25);
  }

  stopLoop() {
    if (this.loopTimer) {
      clearInterval(this.loopTimer);
      this.loopTimer = null;
    }
    this.loopKind = null;
  }

  getLoopBeat() {
    if (!this.loopKind || !this.ctx) return (performance.now() / 1000) * (this.loopBpm / 60);
    return Math.max(0, (this.now() - this.loopStartTime) * (this.loopBpm / 60));
  }

  _playLoopStep(kind, step, t, eighth) {
    const s = step % 32; // 4-bar phrase in eighth notes
    const bar = Math.floor(s / 8);
    const pos = s % 8;

    if (kind === "title") {
      // Sunny upbeat Rhythm Heaven title groove (C major / A minor pop)
      const roots = [48, 45, 41, 43]; // C A F G
      const chords = [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]];
      const mel = [76, 0, 79, 84, 0, 83, 79, 0, 72, 0, 76, 79, 0, 76, 74, 0, 72, 0, 76, 81, 0, 79, 77, 0, 79, 81, 83, 0, 84, 0, 79, 0];
      if (pos === 0 || pos === 5) this.kick(t, 0.72);
      if (pos === 2 || pos === 6) this.snare(t, 0.45);
      if (pos % 2 === 1) this.hat(t, 0.22);
      if (pos === 0 || pos === 3 || pos === 6) this.bass(t, roots[bar], eighth * 1.4, 0.45);
      if (pos === 0 || pos === 4) this.rhodes(t, chords[bar], eighth * 2.5, 0.22);
      if (mel[s]) this.marimba(t, mel[s], eighth * 1.6, 0.32);
    } else if (kind === "menu") {
      // Iconic Rhythm Heaven groovy electro-bossa stage select map loop!
      const roots = [45, 50, 43, 48]; // Am7 Dm7 G7 Cmaj7
      const chords = [[60, 64, 67, 71], [62, 65, 69, 72], [59, 62, 65, 67], [60, 64, 67, 71]];
      const mel = [76, 0, 79, 0, 81, 0, 79, 76, 74, 0, 77, 0, 79, 0, 77, 74, 71, 0, 74, 0, 77, 0, 79, 81, 79, 0, 76, 0, 72, 0, 74, 0];
      if (pos === 0 || pos === 3 || pos === 6) this.kick(t, 0.62, 120);
      if (pos === 2 || pos === 6) this.clap(t, 0.24);
      this.hat(t, pos % 2 === 0 ? 0.16 : 0.24, pos === 7);
      if (pos === 0 || pos === 4 || pos === 6) this.bass(t, roots[bar] + (pos === 6 ? 7 : 0), eighth * 1.3, 0.42);
      if (pos === 0 || pos === 3) this.rhodes(t, chords[bar], eighth * 2.2, 0.24);
      if (mel[s]) this.lead(t, mel[s], eighth * 1.2, 0.17, "celesta");
    } else if (kind === "practice") {
      // Clean warm pocket bed during conversational practice
      if (pos === 0 || pos === 4) this.kick(t, 0.55, 115);
      if (pos === 2 || pos === 6) this.woodblock(t, 76, 0.22);
      if (pos % 2 === 1) this.hat(t, 0.16);
      const r = this.loopSubStage === "ninja" ? [45, 45, 48, 43] : [48, 48, 41, 43];
      if (pos === 0) this.bass(t, r[bar], eighth * 2.5, 0.36, "upright");
      if (pos === 0 || pos === 4) this.rhodes(t, [60, 64, 67], eighth * 1.8, 0.14);
    } else if (kind === "epilogue_superb") {
      // Joyful brass & bell victory celebration loop!
      const roots = [48, 53, 55, 48];
      const chords = [[60, 64, 67, 72], [65, 69, 72, 76], [67, 71, 74, 79], [60, 64, 67, 72]];
      const mel = [84, 0, 83, 84, 88, 0, 84, 0, 86, 0, 84, 81, 79, 0, 0, 0, 79, 83, 86, 0, 88, 86, 83, 0, 84, 0, 79, 84, 88, 0, 0, 0];
      if (pos === 0 || pos === 4) this.kick(t, 0.72);
      if (pos === 2 || pos === 6) { this.snare(t, 0.48); this.clap(t, 0.35); }
      this.hat(t, 0.2, pos === 7);
      if (pos === 0 || pos === 3 || pos === 6) this.bass(t, roots[bar], eighth * 1.2, 0.46);
      if (pos === 0 || pos === 4) this.brass(t, chords[bar], eighth * 1.8, 0.24);
      if (mel[s]) {
        this.marimba(t, mel[s], eighth * 1.5, 0.34);
        this.lead(t, mel[s], eighth * 1.5, 0.18, "celesta");
      }
    } else if (kind === "epilogue_ok") {
      // Breezy happy stroll loop ("좋아!")
      const roots = [48, 45, 41, 43];
      const mel = [76, 0, 79, 0, 76, 74, 72, 0, 72, 0, 76, 0, 79, 0, 0, 0, 77, 0, 76, 0, 74, 72, 74, 0, 79, 0, 76, 0, 72, 0, 0, 0];
      if (pos === 0 || pos === 4) this.kick(t, 0.56);
      if (pos === 2 || pos === 6) this.snare(t, 0.34);
      if (pos % 2 === 1) this.hat(t, 0.18);
      if (pos === 0 || pos === 4) this.bass(t, roots[bar], eighth * 1.8, 0.4, "upright");
      if (pos === 2 || pos === 6) this.rhodes(t, [60, 64, 67], eighth * 1.2, 0.18);
      if (mel[s]) this.marimba(t, mel[s], eighth * 1.6, 0.3);

      if (mel[s]) this.lead(t, mel[s], eighth * 1.4, 0.2, "spy");

  // ===== FULL MULTI-TRACK STAGE BGM ENGINE (Beat-indexed half-beat precision) =====
  // Called by GameSession's lookahead scheduler for every eighth-note (stepIndex = beat * 2)
  playStageEighth(stageId, stepIdx, t, bpm, transpose = 0, activeSubStage = null) {
    const eighth = 60 / bpm / 2;
    const style = stageId === "remix" ? (activeSubStage || "pacifier") : stageId;
    const bar = Math.floor(stepIdx / 8);
    const pos = stepIdx % 8; // 0..7 eighth notes in bar
    const phraseBar = bar % 4;
    const isFill = bar % 4 === 3 && pos >= 5;
    const tr = transpose;

    if (style === "pacifier") {
      // Funky Shibuya-kei / Brass-Pop (Key: C Major / D Minor funk)
      const prog = [
        { root: 48, chord: [60, 64, 67, 71] },
        { root: 45, chord: [57, 60, 64, 69] },
        { root: 50, chord: [62, 65, 69, 72] },
        { root: 43, chord: [59, 62, 65, 71] },
      ];
      const p = prog[phraseBar];
      if (pos === 0 || pos === 3 || (pos === 5 && bar % 2 === 1)) this.kick(t, 0.84, 138);
      if (pos === 2 || pos === 6) { this.snare(t, 0.62); this.clap(t, 0.28); }
      this.hat(t, pos % 2 === 0 ? 0.22 : 0.3, pos === 7);
      if (isFill) {
        this.snare(t, 0.55 + (pos - 5) * 0.1, 210 + (pos - 5) * 28);
      }
      if (pos === 0 || pos === 2 || pos === 5 || pos === 6) {
        const oct = pos === 6 ? 12 : 0;
        this.bass(t, p.root + oct + tr, eighth * 1.15, 0.56, "funk");
      }
      if (pos === 0 || pos === 3) this.rhodes(t, p.chord.map((n) => n + tr), eighth * 2.1, 0.24);
      if (pos === 0 && bar % 2 === 0) this.brass(t, p.chord.map((n) => n + tr), eighth * 1.4, 0.28);
      if (pos === 6 && bar % 2 === 1) this.brass(t, p.chord.map((n) => n + 12 + tr), eighth * 1.2, 0.26);
      // Catchy melody hooks
      const hooks = [
        [76, 0, 79, 0, 81, 79, 76, 0],
        [72, 0, 76, 0, 79, 0, 76, 72],
        [74, 0, 77, 0, 81, 79, 77, 74],
        [79, 81, 83, 0, 84, 0, 79, 0],
      ];
      const m = hooks[phraseBar][pos];
      if (m) this.marimba(t, m + tr, eighth * 1.35, 0.34);
    } else if (style === "burp") {
      // Bouncy Jazz Swing-Pop (Key: F Major)
      const prog = [
        { root: 41, chord: [65, 69, 72, 76] },
        { root: 46, chord: [65, 70, 74, 77] },
        { root: 43, chord: [62, 65, 69, 72] },
        { root: 48, chord: [64, 67, 70, 74] },
      ];
      const p = prog[phraseBar];
      const swingShift = pos % 2 === 1 ? eighth * 0.22 : 0;
      const st = t + swingShift;
      if (pos === 0 || pos === 4) this.kick(st, 0.72, 118);
      if (pos === 2 || pos === 6) this.snare(st, 0.48, 185);
      this.hat(st, pos % 2 === 0 ? 0.28 : 0.2, pos === 3 || pos === 7);
      if (isFill) this.woodblock(st, 72 + (pos - 5) * 4, 0.48);
      // Walking upright bass every beat
      if (pos % 2 === 0) {
        const walk = [0, 4, 7, 5][pos / 2];
        this.bass(st, p.root + walk + tr, eighth * 1.8, 0.56, "upright");
      }
      if (pos === 0 || pos === 3 || pos === 6) {
        this.rhodes(st, p.chord.map((n) => n + tr), eighth * 1.8, 0.25);
      }
      if (pos === 4 && bar % 2 === 1) this.brass(st, p.chord.map((n) => n + tr), eighth * 1.5, 0.28);
      const hooks = [
        [77, 0, 81, 0, 84, 0, 81, 77],
        [82, 0, 81, 79, 77, 0, 74, 0],
        [74, 0, 77, 0, 81, 0, 79, 77],
        [79, 0, 82, 0, 84, 0, 81, 0],
      ];
      const m = hooks[phraseBar][pos];
      if (m) this.marimba(st, m + tr, eighth * 1.5, 0.32);
    } else if (style === "photo") {
      // Energetic Electro-Swing Studio Pop (Key: G Major)
      const prog = [
        { root: 43, chord: [67, 71, 74, 78] },
        { root: 40, chord: [64, 67, 71, 74] },
        { root: 48, chord: [67, 72, 76, 79] },
        { root: 50, chord: [66, 69, 72, 76] },
      ];
      const p = prog[phraseBar];
      if (pos % 2 === 0) this.kick(t, 0.86, 142); // Four-on-the-floor dance studio energy!
      if (pos === 2 || pos === 6) { this.snare(t, 0.64); this.clap(t, 0.44); }
      if (pos % 2 === 1) this.hat(t, 0.32, pos === 7);
      if (isFill) {
        this.clap(t, 0.5);
        this.snare(t, 0.6, 220 + (pos - 5) * 35);
      }
      if (pos === 0 || pos === 1 || pos === 4 || pos === 6) {
        this.bass(t, p.root + (pos === 1 || pos === 6 ? 12 : 0) + tr, eighth * 0.9, 0.56, "funk");
      }
      if (pos === 1 || pos === 3 || pos === 5 || pos === 7) {
        this.rhodes(t, p.chord.map((n) => n + tr), eighth * 0.9, 0.24);
      }
      if (pos === 0) this.brass(t, p.chord.map((n) => n + tr), eighth * 1.2, 0.3);
      const hooks = [
        [79, 0, 83, 86, 0, 83, 79, 0],
        [76, 0, 79, 83, 0, 79, 76, 0],
        [84, 0, 83, 79, 0, 76, 79, 0],
        [81, 83, 86, 0, 88, 0, 86, 0],
      ];
      const m = hooks[phraseBar][pos];
      if (m) this.lead(t, m + tr, eighth * 1.15, 0.22, "pop");
    } else if (style === "ninja") {
      // Smoky Stealth Spy Jazz (Key: A Minor)
      const prog = [
        { root: 45, chord: [60, 64, 67, 71] },
        { root: 45, chord: [60, 64, 68, 71] },
        { root: 50, chord: [62, 65, 69, 72] },
        { root: 40, chord: [59, 64, 68, 71] },
      ];
      const p = prog[phraseBar];
      if (pos === 0 || pos === 4) this.kick(t, 0.68, 108);
      if (pos === 2 || pos === 6) this.woodblock(t, 74, 0.34);
      this.hat(t, pos % 2 === 0 ? 0.16 : 0.24, pos === 6);
      // Iconic spy-movie creeping bassline
      const spyLine = [0, 0, 3, 0, 4, 0, 3, 2];
      if (pos % 2 === 0 || pos === 7) {
        this.bass(t, p.root + spyLine[pos] + tr, eighth * 1.4, 0.58, "upright");
      }
      if (pos === 0 || pos === 6) this.rhodes(t, p.chord.map((n) => n + tr), eighth * 1.6, 0.2);
      const hooks = [
        [76, 0, 79, 0, 80, 79, 76, 0],
        [72, 0, 76, 0, 75, 0, 72, 0],
        [74, 0, 77, 0, 81, 0, 77, 74],
        [76, 0, 75, 0, 76, 0, 0, 0],
      ];
      const m = hooks[phraseBar][pos];
      if (m) this.lead(t, m + tr, eighth * 1.4, 0.22, "spy");
    }
  }
}

// Cel-Shaded Hierarchical Character Rigging, Mascot, and 15 Bespoke Epilogue Comic Illustrations

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawStrokedText(ctx, text, x, y, size, fill = "#FFFFFF", stroke = INK, strokeW = 7, align = "center", font = FONT_MAIN) {
  ctx.save();
  ctx.font = `900 ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  if (strokeW > 0) {
    ctx.lineWidth = strokeW;
    ctx.strokeStyle = stroke;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawContactShadow(ctx, x, y, rx, ry, alpha = 0.28) {
  ctx.save();
  ctx.fillStyle = `rgba(26, 16, 42, ${alpha})`;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Minimal Rhythm Heaven player indicator ("나")
function drawYouTag(ctx, x, y, pulse = 0) {
  ctx.save();
  const s = 1 + pulse * 0.08;
  ctx.translate(x, y);
  ctx.scale(s, s);
  roundRectPath(ctx, -28, -16, 56, 32, 16);
  ctx.fillStyle = "#FF4D79";
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = "#FFFFFF";
  ctx.stroke();
  drawStrokedText(ctx, "나", 0, 1, 20, "#FFFFFF", INK, 4);
  ctx.restore();
}

// Reusable Pacifier prop (can spin, scale in perspective, glow gold for Skill Star)
function drawPacifier(ctx, x, y, scale = 1, rot = 0, golden = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  if (golden) {
    ctx.save();
    const glow = ctx.createRadialGradient(0, 0, 6, 0, 0, 44);
    glow.addColorStop(0, "rgba(255, 240, 130, 0.72)");
    glow.addColorStop(0.55, "rgba(255, 220, 90, 0.28)");
    glow.addColorStop(1, "rgba(255, 220, 90, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Silicone nipple (pointing right/up)
  ctx.beginPath();
  ctx.ellipse(14, 0, 14, 9, 0, 0, Math.PI * 2);
  ctx.fillStyle = golden ? "#FFF5B8" : "#FFE7A0";
  ctx.fill();
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = INK;
  ctx.stroke();

  // Shield plate
  ctx.beginPath();
  ctx.ellipse(0, 0, 13, 21, 0, 0, Math.PI * 2);
  ctx.fillStyle = golden ? "#FFD43B" : "#FF6B9D";
  ctx.fill();
  ctx.stroke();

  // Cel highlight on shield
  ctx.beginPath();
  ctx.ellipse(-3, -7, 4, 8, -0.2, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fill();

  // Center knob
  ctx.beginPath();
  ctx.arc(-6, 0, 8.5, 0, Math.PI * 2);
  ctx.fillStyle = golden ? "#FFF099" : "#FFE156";
  ctx.fill();
  ctx.stroke();

  // Handle ring
  ctx.beginPath();
  ctx.arc(-18, 0, 11, 0, Math.PI * 2);
  ctx.lineWidth = 5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = golden ? "#FFF6C8" : "#FFFFFF";
  ctx.stroke();

  ctx.restore();
}

// Reusable squeaky rubber duck prop
function drawRubberDuck(ctx, x, y, scale = 1, squished = 0) {
  ctx.save();
  ctx.translate(x, y);
  const sx = scale * (1 + squished * 0.38);
  const sy = scale * (1 - squished * 0.34);
  ctx.scale(sx, sy);

  // Body
  ctx.beginPath();
  ctx.ellipse(0, 8, 22, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#FFD93D";
  ctx.fill();
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = INK;
  ctx.stroke();

  // Head
  ctx.beginPath();
  ctx.arc(-10, -8, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Beak
  ctx.beginPath();
  ctx.ellipse(-23, -6, 7, 4.2, -0.1, 0, Math.PI * 2);
  ctx.fillStyle = "#FF7B29";
  ctx.fill();
  ctx.stroke();

  // Eye
  ctx.beginPath();
  ctx.arc(-14, -10, 2.8, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();

  // Wing
  ctx.beginPath();
  ctx.ellipse(5, 8, 9, 5, -0.25, 0, Math.PI * 2);
  ctx.fillStyle = "#FFC422";
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

// =========================================================================
// ARTICULATED CEL-SHADED BABY RIG
// =========================================================================
function drawBaby(ctx, opts = {}) {
  const {
    x = 640, y = 420,
    scale = 1,
    sx = 1, sy = 1,
    rot = 0,
    expr = "happy", // happy | mischievous | puff | spit | bliss | sleepy | burp_charge | burp_boom | sparkle | shock | giggle
    onesie = "#7CE8FF",
    onesieTrim = "#FFE156",
    armL = 0, // radians
    armR = 0,
    hasPacifier = false,
    pacifierGolden = false,
    cheekInflation = 0, // 0..1
    bellyInflation = 0, // 0..1
    blink = false,
    hairLag = 0,
    crown = false,
    handsOnCheeks = false,
    shadow = true,
  } = opts;

  ctx.save();
  if (shadow) drawContactShadow(ctx, x, y + 66 * scale, 56 * scale, 16 * scale, 0.25);

  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale * sx, scale * sy);

  // Chubby legs / feet
  ctx.lineWidth = 4;
  ctx.strokeStyle = INK;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 24, 48);
    ctx.rotate(side * 0.22);
    ctx.beginPath();
    ctx.ellipse(0, 6, 15, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD7BA";
    ctx.fill();
    ctx.stroke();
    // Little sock
    ctx.beginPath();
    ctx.ellipse(side * 4, 8, 10, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = onesieTrim;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Onesie Torso (expands with bellyInflation during Burp Hold!)
  const bw = 42 + bellyInflation * 14;
  const bh = 38 + bellyInflation * 10;
  ctx.beginPath();
  ctx.ellipse(0, 22, bw, bh, 0, 0, Math.PI * 2);
  ctx.fillStyle = onesie;
  ctx.fill();
  ctx.stroke();

  // Cel shadow on onesie bottom
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 22, bw - 2, bh - 2, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = "rgba(38, 25, 44, 0.12)";
  ctx.beginPath();
  ctx.ellipse(8, 36, bw, bh * 0.72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Cute bib with star badge
  ctx.beginPath();
  ctx.moveTo(-24, -4);
  ctx.quadraticCurveTo(0, 30, 24, -4);
  ctx.closePath();
  ctx.fillStyle = "#FFF9F0";
  ctx.fill();
  ctx.stroke();
  drawStarPath(ctx, 0, 7, 5, 7, 3.2);
  ctx.fillStyle = onesieTrim;
  ctx.fill();

  // Arms (either animated waving or hands-on-cheeks pose!)
  if (!handsOnCheeks) {
    for (const [side, ang] of [[-1, armL], [1, armR]]) {
      ctx.save();
      ctx.translate(side * (bw - 6), 8);
      ctx.rotate(side * (0.45 + ang));
      roundRectPath(ctx, -11, -8, 22, 32, 11);
      ctx.fillStyle = onesie;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 22, 10.5, 0, Math.PI * 2);
      ctx.fillStyle = "#FFD7BA";
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  // Oversized expressive head
  ctx.save();
  ctx.translate(0, -34);

  // Cute round ears
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(side * 54, 4, 13, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD7BA";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(side * 54, 4, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#F5B89E";
    ctx.fill();
  }

  // Head base (widens slightly when cheeks puff)
  const headRx = 56 + cheekInflation * 8;
  const headRy = 50 + cheekInflation * 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, headRx, headRy, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE0C8";
  ctx.fill();
  ctx.stroke();

  // Warm rim highlight on forehead
  ctx.beginPath();
  ctx.ellipse(-18, -26, 20, 10, -0.35, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
  ctx.fill();

  // Iconic springy baby hair curl on top!
  ctx.save();
  ctx.translate(0, -49);
  ctx.rotate(hairLag);
  ctx.beginPath();
  ctx.moveTo(-4, 4);
  ctx.bezierCurveTo(-18, -22, 14, -32, 14, -10);
  ctx.bezierCurveTo(14, -2, 2, 0, 4, -8);
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.restore();

  if (crown) {
    ctx.save();
    ctx.translate(0, -56);
    ctx.beginPath();
    ctx.moveTo(-22, 6);
    ctx.lineTo(-26, -16);
    ctx.lineTo(-10, -4);
    ctx.lineTo(0, -22);
    ctx.lineTo(10, -4);
    ctx.lineTo(26, -16);
    ctx.lineTo(22, 6);
    ctx.closePath();
    ctx.fillStyle = "#FFD93D";
    ctx.fill();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.restore();
  }

  // Rosy cheeks (puff out hugely on puff/burp_charge!)
  const blushR = 11 + cheekInflation * 9 + (expr === "burp_charge" ? 6 : 0);
  const blushAlpha = expr === "burp_charge" || expr === "puff" ? 0.8 : 0.48;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(side * (33 + cheekInflation * 4), 12, blushR, blushR * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 108, 138, ${blushAlpha})`;
    ctx.fill();
    if (cheekInflation > 0.35) {
      ctx.lineWidth = 2.6;
      ctx.strokeStyle = "rgba(180, 60, 88, 0.5)";
      ctx.stroke();
    }
  }

  // EYES & BROWS
  const eyeY = -4;
  for (const side of [-1, 1]) {
    const ex = side * 22;
    ctx.save();
    ctx.translate(ex, eyeY);
    if (blink || expr === "bliss" || expr === "giggle") {
      // Happy curved ^ ^
      ctx.beginPath();
      ctx.arc(0, 4, 10, Math.PI * 1.12, Math.PI * 1.88);
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = INK;
      ctx.lineCap = "round";
      ctx.stroke();
    } else if (expr === "sleepy") {
      // Peaceful closed U U
      ctx.beginPath();
      ctx.arc(0, -2, 10, Math.PI * 0.15, Math.PI * 0.85);
      ctx.lineWidth = 4.2;
      ctx.strokeStyle = INK;
      ctx.lineCap = "round";
      ctx.stroke();
    } else if (expr === "shock") {
      // Huge wide-awake comic eyes!
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = INK;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
    } else if (expr === "sparkle") {
      // Radiant star-shine eyes!
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      drawStarPath(ctx, -2, -2, 4, 8, 3);
      ctx.fillStyle = "#FFE156";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(4, 4, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
    } else if (expr === "burp_charge") {
      // Tightly squeezed > < eyes!
      ctx.beginPath();
      ctx.moveTo(-side * 7, -6);
      ctx.lineTo(side * 6, 0);
      ctx.lineTo(-side * 7, 6);
      ctx.lineWidth = 4.2;
      ctx.strokeStyle = INK;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
    } else {
      // Expressive shiny cartoon eyes
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 10.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-3, -3.5, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(3, 3, 1.8, 0, Math.PI * 2);
      ctx.fill();
      if (expr === "mischievous") {
        // Smug angled eyebrow
        ctx.beginPath();
        ctx.moveTo(-10, -14 + side * 2);
        ctx.lineTo(10, -14 - side * 5);
        ctx.lineWidth = 3.8;
        ctx.strokeStyle = INK;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // MOUTH
  ctx.save();
  ctx.translate(0, 17);
  ctx.lineWidth = 3.8;
  ctx.strokeStyle = INK;
  ctx.lineCap = "round";
  if (expr === "puff") {
    // Tight puckered cheek-puff mouth
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.quadraticCurveTo(0, -4, 7, 0);
    ctx.stroke();
  } else if (expr === "spit") {
    // Round O blasting mouth!
    ctx.beginPath();
    ctx.arc(0, 2, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#D6456B";
    ctx.fill();
    ctx.stroke();
  } else if (expr === "burp_boom") {
    // Giant jubilant belch mouth!
    ctx.beginPath();
    ctx.ellipse(0, 3, 18, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#B82B54";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 11, 10, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FF8FA3";
    ctx.fill();
  } else if (expr === "shock") {
    ctx.beginPath();
    ctx.ellipse(0, 4, 13, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#D6456B";
    ctx.fill();
    ctx.stroke();
  } else if (expr === "sleepy") {
    ctx.beginPath();
    ctx.ellipse(0, 3, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#F07A96";
    ctx.fill();
    ctx.stroke();
  } else if (expr === "mischievous") {
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.quadraticCurveTo(2, 12, 16, -4);
    ctx.stroke();
  } else if (expr === "burp_charge") {
    ctx.beginPath();
    ctx.moveTo(-10, 2);
    ctx.bezierCurveTo(-4, -4, 4, 8, 10, 2);
    ctx.stroke();
  } else {
    // Big joyful beaming baby smile with cute tiny tooth!
    ctx.beginPath();
    ctx.arc(0, -2, 14, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.closePath();
    ctx.fillStyle = "#E8557A";
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(-4, 2, 8, 4.5);
  }
  ctx.restore();

  if (hasPacifier) {
    drawPacifier(ctx, 0, 20, 0.92, Math.PI, pacifierGolden);
  }

  // Angelic "hands-on-cheeks" studio pose!
  if (handsOnCheeks) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * 44, 18, 14, 0, Math.PI * 2);
      ctx.fillStyle = "#FFD7BA";
      ctx.fill();
      ctx.lineWidth = 3.8;
      ctx.strokeStyle = INK;
      ctx.stroke();
    }
  }

  ctx.restore(); // end head
  ctx.restore(); // end baby
}

// =========================================================================
// ARTICULATED CEL-SHADED PAJAMA DAD RIG

function drawDad(ctx, opts = {}) {
  const {
    x = 300, y = 500,

    sx = 1, sy = 1,
    rot = 0,
    mode = "front", // front | ots | ninja | sleepy | victory
    expr = "tired", // tired | focus | happy | shock | bonk | sleep | thumbsup | crane
    handAction = 0, // 0..1 punch/catch/pat extension
    stepPhase = 0,
    ninjaBand = false,
    bump = false,

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale * sx, scale * sy);
  ctx.lineWidth = 4.2;
  ctx.strokeStyle = INK;
  ctx.lineJoin = "round";

    // Over-the-shoulder foreground pajama Dad (Stage 1 Pacifier Sniper!)
