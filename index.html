    ctx.arc(-44, 8, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#F2BC98"; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 0, 54, 56, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#F7CAA8";
    ctx.fill();
    ctx.stroke();
    // Friendly soft cel-shaded bedhead hair (no spiky receding artifacts!)
    ctx.beginPath();
    ctx.arc(-8, -10, 56, Math.PI * 0.65, Math.PI * 1.92);
    ctx.quadraticCurveTo(36, -54, 18, -32);
    ctx.quadraticCurveTo(4, -46, -12, -32);
    ctx.quadraticCurveTo(-26, -12, -34, 24);
    ctx.closePath();
    ctx.fillStyle = "#31243D";
    ctx.fill();
    ctx.stroke();
    // Cute sleepy ahoge cowlick tuft on crown!
    ctx.beginPath();
    ctx.moveTo(-10, -64);
    ctx.quadraticCurveTo(-2, -88, 18, -74);
    ctx.quadraticCurveTo(2, -70, -2, -62);
    ctx.fill();
    ctx.stroke();

    // Cute side nose + warm cheek
    ctx.beginPath();
    ctx.arc(48, 8, 7, -0.45 * Math.PI, 0.45 * Math.PI);
    ctx.fillStyle = "#F7CAA8"; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(24, 18, 9, 5.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 118, 145, 0.35)"; ctx.fill();

    // Side profile eye / reaction
    if (expr === "bonk") {
      // Comic red lump on head + dizzy spiral eye
      ctx.beginPath();
      ctx.arc(38, -28, 17, 0, Math.PI * 2);
      ctx.fillStyle = "#FF5C77";
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(26, -4); ctx.lineTo(38, 6);
      ctx.moveTo(38, -4); ctx.lineTo(26, 6);
      ctx.lineWidth = 4;
      ctx.stroke();
    } else if (expr === "happy") {
      ctx.beginPath();
      ctx.arc(32, -2, 8, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(33, -2, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      // Tired Dad eye bag
      ctx.beginPath();
      ctx.arc(33, 5, 8, 0.1 * Math.PI, 0.85 * Math.PI);
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = "rgba(80, 50, 95, 0.55)";
      ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 4.2;
    }
    ctx.restore();

    // Expressive foreground catching hand!
    ctx.save();
    const reachX = 115 + handAction * 110;
    const reachY = 24 - handAction * 92;
    ctx.translate(reachX, reachY);
    ctx.rotate(-0.45 + handAction * 0.45);
    // Forearm sleeve
    roundRectPath(ctx, -95, -18, 95, 38, 16);
    ctx.fillStyle = "#3D4F85";
    ctx.fill();
    ctx.stroke();
    // Open/snatching palm
    ctx.beginPath();
    ctx.ellipse(16, 0, 26, 22, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#F7CAA8";
    ctx.fill();
    ctx.stroke();
    // Fingers
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.ellipse(34, i * 10, 12, 6, i * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
    return;
  }

  // Full / Half-body Dad (Ninja, Sleepy, Victory, Front)
  if (mode === "ninja") {
    // Pajama legs cleanly anchored at hip joints (never detaching during crane pose!)
    const isCrane = expr === "crane";
    for (const side of [-1, 1]) {
      ctx.save();
      const hipX = side * 18;
      const hipY = 50;
      ctx.translate(hipX, hipY);
      if (isCrane && side === 1) {
        // Hilarious bent-knee one-leg ninja crane freeze!
        ctx.rotate(-1.05);
        roundRectPath(ctx, -12, -4, 24, 34, 10);
        ctx.fillStyle = "#3D4F85"; ctx.fill(); ctx.stroke();
        ctx.translate(0, 26);
        ctx.rotate(1.35);
        roundRectPath(ctx, -11, -4, 22, 30, 10);
        ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(6, 26, 17, 9, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#FF8FA3"; ctx.fill(); ctx.stroke();
      } else {
        const sw = isCrane ? 0 : Math.sin(stepPhase + (side > 0 ? Math.PI : 0));
        ctx.rotate(sw * 0.28);
        roundRectPath(ctx, -13, -4, 26, 56, 12);
        ctx.fillStyle = "#3D4F85"; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(side * 6, 54, 18, 9, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#FF8FA3"; ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  } else {
    // Grounded slippers/legs for front/victory/sleepy modes so Dad never looks like a floating capsule
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(side * 22, 62, 18, 10, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#FF8FA3"; ctx.fill(); ctx.stroke();
    }
  }

  // Torso (striped pajamas)
  roundRectPath(ctx, -46, -12, 92, 74, 28);
  ctx.fillStyle = "#485E9B";
  ctx.fill();
  ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = "#627BBD";
  for (let xp = -42; xp <= 42; xp += 22) ctx.fillRect(xp, -15, 9, 80);
  ctx.restore();
  ctx.stroke();
  // Collar
  ctx.beginPath();
  ctx.moveTo(-18, -12); ctx.lineTo(0, 8); ctx.lineTo(18, -12);
  ctx.fillStyle = "#FFF7EA";
  ctx.fill();
  ctx.stroke();

  // Expressive arms for non-ninja modes
  if (mode === "ninja") {
    const spread = expr === "crane" ? 1.25 : 0.45 + Math.sin(stepPhase) * 0.3;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * 42, 4);
      ctx.rotate(side * (-spread));
      roundRectPath(ctx, -11, -8, 22, 46, 11);
      ctx.fillStyle = "#485E9B";
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 40, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#F7CAA8";
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  } else if (expr === "thumbsup" || mode === "victory") {
    // Left resting arm + Right triumphant fist/thumbsup arm!
    ctx.save();
    ctx.translate(-44, 8); ctx.rotate(0.35);
    roundRectPath(ctx, -10, -6, 20, 40, 10); ctx.fillStyle = "#485E9B"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 36, 10, 0, Math.PI * 2); ctx.fillStyle = "#F7CAA8"; ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(46, 8);
    ctx.rotate(-2.3);
    roundRectPath(ctx, -11, -8, 22, 48, 11);
    ctx.fillStyle = "#485E9B";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 44, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#F7CAA8";
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  } else {
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * 44, 10);
      ctx.rotate(side * -0.22);
      roundRectPath(ctx, -10, -6, 20, 38, 10);
      ctx.fillStyle = "#485E9B"; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 34, 9.5, 0, Math.PI * 2);
      ctx.fillStyle = "#F7CAA8"; ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // Head
  ctx.save();
  ctx.translate(0, -54);
  ctx.beginPath();
  ctx.ellipse(0, 0, 44, 46, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#F7CAA8";
  ctx.fill();
  ctx.stroke();

  // Bedhead hair
  ctx.beginPath();
  ctx.arc(0, -10, 45, Math.PI * 0.92, Math.PI * 2.08);
  ctx.lineTo(44, -22);
  ctx.lineTo(22, -46);
  ctx.lineTo(6, -34);
  ctx.lineTo(-10, -58);
  ctx.lineTo(-26, -38);
  ctx.lineTo(-44, -22);
  ctx.closePath();
  ctx.fillStyle = "#31243D";
  ctx.fill();
  ctx.stroke();

  // Red Ninja Headband (Stage 4!)
  if (ninjaBand) {
    roundRectPath(ctx, -45, -24, 90, 14, 5);
    ctx.fillStyle = "#FF3E6C";
    ctx.fill();
    ctx.stroke();
    // Fluttering headband tails
    ctx.beginPath();
    ctx.moveTo(42, -18);
    ctx.quadraticCurveTo(64, -24 + Math.sin(stepPhase * 2) * 8, 76, -8 + Math.cos(stepPhase * 2) * 8);
    ctx.lineTo(68, 2);
    ctx.quadraticCurveTo(56, -12, 42, -12);
    ctx.closePath();
    ctx.fillStyle = "#FF3E6C";
    ctx.fill();
    ctx.stroke();
  }

  if (bump) {
    ctx.beginPath();
    ctx.arc(20, -44, 14, 0, Math.PI * 2);
    ctx.fillStyle = "#FF5C77";
    ctx.fill();
    ctx.stroke();
  }

  // Eyes
  for (const side of [-1, 1]) {
    const ex = side * 16;
    if (expr === "sleep") {
      ctx.beginPath();
      ctx.arc(ex, 0, 8, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else if (expr === "happy" || expr === "thumbsup") {
      ctx.beginPath();
      ctx.arc(ex, 4, 8, 1.1 * Math.PI, 1.9 * Math.PI);
      ctx.stroke();
    } else if (expr === "shock") {
      ctx.beginPath();
      ctx.arc(ex, 0, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex, 0, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(ex, 0, 4.8, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      // Relatable tired parenting dark circles!
      ctx.beginPath();
      ctx.arc(ex, 5, 8, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = "rgba(85, 55, 105, 0.55)";
      ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 4.2;
    }
  }

  // Mouth
  if (expr === "sleep") {
    ctx.beginPath();
    ctx.ellipse(0, 20, 9, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#C94B6A";
    ctx.fill();
    ctx.stroke();
    // Comic sleep bubble!
    ctx.beginPath();
    ctx.arc(14, 12, 13, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(180, 235, 255, 0.72)";
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.stroke();
  } else if (expr === "shock") {
    ctx.beginPath();
    ctx.ellipse(0, 20, 13, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#C94B6A";
    ctx.fill();
    ctx.stroke();
  } else if (expr === "happy" || expr === "thumbsup") {
    ctx.beginPath();
    ctx.arc(0, 14, 14, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.closePath();
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.stroke();
  } else if (expr === "crane") {
    ctx.beginPath();
    ctx.moveTo(-10, 20); ctx.bezierCurveTo(-4, 16, 4, 24, 10, 20);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-10, 20); ctx.quadraticCurveTo(0, 25, 10, 18);
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

// =========================================================================
// STUDIO PHOTOGRAPHER RIG (Stage 3: Peek-a-Boo Studio)
// =========================================================================
function drawPhotographer(ctx, opts = {}) {
  const { x = 280, y = 450, scale = 1, fanOpen = 0, bounce = 0, side = 0, expr = "cheer" } = opts;
  ctx.save();
  ctx.translate(x, y + bounce);
  ctx.scale(scale, scale);
  ctx.lineWidth = 4;
  ctx.strokeStyle = INK;
  ctx.lineJoin = "round";

  // Grounded cute studio shoes + gesturing left arm
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * 18, 92, 16, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#5B3B5E"; ctx.fill(); ctx.stroke();
  }
  ctx.save();
  ctx.translate(-38, 22); ctx.rotate(0.55 - fanOpen * 0.4);
  roundRectPath(ctx, -10, -6, 20, 38, 10);
  ctx.fillStyle = "#FF8E3C"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 34, 9.5, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE0C4"; ctx.fill(); ctx.stroke();
  ctx.restore();

  // Colorful striped studio vest body
  roundRectPath(ctx, -40, 0, 80, 88, 24);
  ctx.fillStyle = "#FF8E3C";
  ctx.fill();
  ctx.stroke();
  // Bowtie
  ctx.beginPath();
  ctx.moveTo(-16, 6); ctx.lineTo(16, 20); ctx.lineTo(16, 6); ctx.lineTo(-16, 20); ctx.closePath();
  ctx.fillStyle = "#FF3E6C";
  ctx.fill();
  ctx.stroke();

  // Head
  ctx.save();
  ctx.translate(0, -44);
  // Goofy plush bunny-ear headband!
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * 18, -34);
    ctx.rotate(s * (0.22 + Math.sin(bounce * 0.25) * 0.12));
    ctx.beginPath();
    ctx.ellipse(0, -24, 12, 28, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FFF5FA";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -22, 6, 18, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#FFA6C1";
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(0, 0, 42, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE0C4";
  ctx.fill();
  ctx.stroke();
  // Hair bangs
  ctx.beginPath();
  ctx.arc(0, -8, 42, Math.PI * 1.05, Math.PI * 1.95);
  ctx.fillStyle = "#5B3B5E";
  ctx.fill();
  ctx.stroke();
  // Cheerful glasses & eyes
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * 15, 2, 11, 0, Math.PI * 2);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s * 15 + side * 3, 2, 4, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.fill();
  }
  // Big grin
  ctx.beginPath();
  ctx.arc(0, 14, 14, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.closePath();
  ctx.fillStyle = expr === "boo" ? "#FF4D79" : "#FFFFFF";
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Giant pastel Peek-a-Boo Fan (covers face when fanOpen > 0.5!)
  ctx.save();
  const fY = lerp(56, -42, fanOpen);
  const fScale = lerp(0.55, 1.15, fanOpen);
  ctx.translate(48 * (1 - fanOpen), fY);
  ctx.scale(fScale, fScale);
  ctx.beginPath();
  ctx.moveTo(0, 26);
  ctx.arc(0, 26, 62, Math.PI * 1.12, Math.PI * 1.88);
  ctx.closePath();
  ctx.fillStyle = "#FFE156";
  ctx.fill();
  ctx.stroke();
  // Fan ribs
  ctx.lineWidth = 2.4;
  for (let a = 1.25; a <= 1.75; a += 0.16) {
    ctx.beginPath();
    ctx.moveTo(0, 26);
    ctx.lineTo(Math.cos(Math.PI * a) * 58, 26 + Math.sin(Math.PI * a) * 58);
    ctx.stroke();
  }
  drawStrokedText(ctx, "까꿍", 0, -4, 22, "#FF3E6C", "#FFFFFF", 5);
  ctx.restore();
  ctx.restore();
}

// =========================================================================
// PERCHED MENU MASCOT ("쪽쪽 요정" — Rhythm Heaven 2.5D Info Card Overhang!)
// =========================================================================
function drawMascot(ctx, x, y, beatPhase, mood = "happy") {
  const b = Math.sin(beatPhase * Math.PI * 2);
  const hop = Math.abs(Math.sin(beatPhase * Math.PI)) * 6;
  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = 3.8;
  ctx.strokeStyle = INK;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // Dangling swinging legs OVER the card top edge!
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 16, 12);
    ctx.rotate(b * 0.36 * side);
    roundRectPath(ctx, -8, 0, 16, 26, 8);
    ctx.fillStyle = "#FFF0DF";
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 24, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#FF7396";
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Tiny fluttering fairy wings
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 26, -16 - hop * 0.5);
    ctx.rotate(side * (0.25 + b * 0.25));
    ctx.beginPath();
    ctx.ellipse(side * 12, 0, 18, 11, side * -0.3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Round seated plush body
  ctx.save();
  ctx.translate(0, -hop * 0.6);
  ctx.beginPath();
  ctx.ellipse(0, -6, 30, 26, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#8AF0D1";
  ctx.fill();
  ctx.stroke();

  // Golden star belly charm
  drawStarPath(ctx, 0, -4, 5, 10, 4.5);
  ctx.fillStyle = "#FFE156";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.lineWidth = 3.8;

  // Expressive head bobbing to Menu BPM!
  ctx.save();
  ctx.translate(0, -42);
  ctx.rotate(b * 0.14);

  // Bouncy musical-note antenna
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.quadraticCurveTo(b * 12, -52, 8 + b * 10, -56);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(10 + b * 10, -56, 8, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE156";
  ctx.fill();
  ctx.stroke();

  // Head oval
  ctx.beginPath();
  ctx.ellipse(0, 0, 38, 33, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE6D0";
  ctx.fill();
  ctx.stroke();

  // Mint hood trim
  ctx.beginPath();
  ctx.arc(0, -4, 39, Math.PI * 0.95, Math.PI * 2.05);
  ctx.fillStyle = "#8AF0D1";
  ctx.fill();
  ctx.stroke();

  // Cheeks
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * 22, 8, 7, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 105, 145, 0.55)";
    ctx.fill();
  }

  // Mood-reactive face!
  if (mood === "remix") {
    // Cool star-shaped shades for Remix tile!
    for (const s of [-1, 1]) {
      drawStarPath(ctx, s * 14, -2, 5, 12, 6);
      ctx.fillStyle = "#FF3E6C";
      ctx.fill();
      ctx.lineWidth = 2.6;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 12, 10, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  } else if (mood === "locked") {
    // Puzzled eyes + floating "?"
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * 13, -2, 5, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.ellipse(0, 12, 6, 5, 0, 0, Math.PI * 2);
    ctx.stroke();
    drawStrokedText(ctx, "?", 44, -28, 30, "#FFE156", INK, 6);
  } else if (mood === "celebrate") {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * 13, 0, 7, 1.1 * Math.PI, 1.9 * Math.PI);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 10, 11, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.closePath();
    ctx.fillStyle = "#FF5C8A";
    ctx.fill();
    ctx.stroke();
  } else {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * 13, -2, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 13 - 2, -4, 2, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
    }
    // Cute mini pacifier in mouth
    drawPacifier(ctx, 0, 12, 0.56, Math.PI, false);
  }
  ctx.restore(); // head
  ctx.restore(); // body
  ctx.restore();
}

// =========================================================================
// 15 BESPOKE 1-CUT EPILOGUE COMIC ILLUSTRATIONS (5 Stages x 3 Ranks)
// =========================================================================
function drawEpilogueComic(ctx, x, y, w, h, stageId, rank, animT) {
  ctx.save();
  // Polaroid / Comic Frame card with slight playful tilt
  ctx.translate(x + w * 0.5, y + h * 0.5);
  ctx.rotate(-0.025);
  ctx.translate(-w * 0.5, -h * 0.5);

  // Drop shadow
  ctx.fillStyle = "rgba(15, 8, 28, 0.45)";
  roundRectPath(ctx, 10, 14, w, h, 20);
  ctx.fill();

  // White card border
  roundRectPath(ctx, 0, 0, w, h, 20);
  ctx.fillStyle = "#FFFDF7";
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = INK;
  ctx.stroke();

  // Inner comic panel viewport
  const pad = 16;
  const iw = w - pad * 2;
  const ih = h - pad * 2 - 48;
  ctx.save();
  roundRectPath(ctx, pad, pad, iw, ih, 12);
  ctx.clip();

  // Panel background gradient by rank
  const bgGrad = ctx.createLinearGradient(0, pad, 0, pad + ih);
  if (rank === "superb") {
    bgGrad.addColorStop(0, "#FFE270");
    bgGrad.addColorStop(1, "#FF9A8B");
  } else if (rank === "ok") {
    bgGrad.addColorStop(0, "#8DE4FF");
    bgGrad.addColorStop(1, "#C5F5C2");
  } else {
    bgGrad.addColorStop(0, "#5B557A");
    bgGrad.addColorStop(1, "#352F4F");
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(pad, pad, iw, ih);

  // Subtle rotating sunburst rays for Superb!
  const cx = pad + iw * 0.5;
  const cy = pad + ih * 0.55;
  if (rank === "superb") {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(animT * 0.35);
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-22, -320);
      ctx.lineTo(22, -320);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  const bob = Math.sin(animT * 5) * 6;

  // Stage x Rank custom gag scenes!
  if (stageId === "pacifier") {
    if (rank === "superb") {
      // Baby crowned Pacifier King on crescent moon + Dad cheering!
      ctx.fillStyle = "#FFF3A1";
      ctx.beginPath(); ctx.arc(cx - 50, cy - 10, 72, 0.2 * Math.PI, 1.5 * Math.PI); ctx.fill();
      drawBaby(ctx, { x: cx - 46, y: cy + 8 + bob, scale: 0.72, expr: "sparkle", crown: true, hasPacifier: true, pacifierGolden: true, shadow: false });
      drawDad(ctx, { x: cx + 82, y: cy + 44 - bob * 0.5, scale: 0.72, mode: "victory", expr: "thumbsup" });
    } else if (rank === "ok") {
      drawBaby(ctx, { x: cx - 32, y: cy + 16, scale: 0.76, expr: "bliss", hasPacifier: true, shadow: false });
      drawDad(ctx, { x: cx + 76, y: cy + 38 + bob * 0.4, scale: 0.7, mode: "front", expr: "happy" });
    } else {
      // Dad plastered with pacifiers while Baby laughs!
      drawDad(ctx, { x: cx - 55, y: cy + 42, scale: 0.75, mode: "front", expr: "shock", bump: true });
      drawPacifier(ctx, cx - 72, cy - 6, 0.58, 0.3);

  } else if (stageId === "photo") {
    if (rank === "superb") {

      drawBaby(ctx, { x: cx, y: cy + 24 + bob * 0.6, scale: 0.88, expr: "sparkle", handsOnCheeks: true, crown: true, onesie: "#FF8FA3", shadow: false });

    } else {

      drawRubberDuck(ctx, cx, cy + 56, 1.35, Math.abs(Math.sin(animT * 8)) * 0.4);

  } else {
    // GRAND REMIX! Whole cast curtain call!
    if (rank === "superb") {

/* ===== src/charts.js ===== */
// 5 Hand-Crafted Flagship Stage Charts, Practice Scripts, Theme Palettes, & Comedic Reviews
// Event schema:
//   { id, beat, type: "tap"|"hold"|"release"|"rest", subStage, cueBeat, cues: [{beat, kind, tag}], skillStar?, meta? }
// Cues are scheduled sample-accurately by the audio lookahead clock and drive character anticipation!

function buildPacifierChart() {
  const events = [];
  const cues = [];
  let eid = 1;

  // Count-in beats 0..3
  cues.push({ beat: 0, kind: "count_tick", tag: "1", subStage: "pacifier" });
  cues.push({ beat: 1, kind: "count_tick", tag: "2", subStage: "pacifier" });
  cues.push({ beat: 2, kind: "count_tick", tag: "3", subStage: "pacifier" });
  cues.push({ beat: 3, kind: "count_go", tag: "GO!", subStage: "pacifier" });

  function addSingle(b, opts = {}) {
    cues.push({ beat: b, kind: "baby_puff", tag: "puff", subStage: "pacifier" });
    cues.push({ beat: b + 1, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2, golden: !!opts.skillStar });
    events.push({
      id: `p_${eid++}`, beat: b + 2, type: "tap", subStage: "pacifier",
      cueBeat: b + 1, sfx: "dad_catch", comic: "쫍!", skillStar: !!opts.skillStar,
      meta: { kind: "single", spitBeat: b + 1 },
    });
  }

  function addDouble(b) {
    cues.push({ beat: b, kind: "baby_puff", tag: "puff", subStage: "pacifier" });
    cues.push({ beat: b + 1, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2, lane: -1 });
    cues.push({ beat: b + 1.5, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2.5, lane: 1 });
    events.push({
      id: `p_${eid++}`, beat: b + 2, type: "tap", subStage: "pacifier",
      cueBeat: b + 1, sfx: "dad_catch", comic: "쫍!",
      meta: { kind: "double1", spitBeat: b + 1, lane: -1 },
    });
    events.push({
      id: `p_${eid++}`, beat: b + 2.5, type: "tap", subStage: "pacifier",
      cueBeat: b + 1.5, sfx: "dad_catch", comic: "쫍!!",
      meta: { kind: "double2", spitBeat: b + 1.5, lane: 1 },
    });
  }

  function addMegaLob(b, skillStar = false) {
    if (skillStar) cues.push({ beat: b - 1, kind: "skill_star_cue", tag: "skill_star", subStage: "pacifier" });
    cues.push({ beat: b, kind: "baby_lob", tag: "lob_charge", subStage: "pacifier" });
    cues.push({ beat: b + 1, kind: "baby_spit", tag: "lob_spit", subStage: "pacifier", targetBeat: b + 3, golden: skillStar });
    events.push({
      id: `p_${eid++}`, beat: b + 3, type: "tap", subStage: "pacifier",
      cueBeat: b + 1, sfx: "dad_catch", comic: skillStar ? "★ 대성공!!" : "나이스 캐치!",
      skillStar, meta: { kind: "lob", spitBeat: b + 1 },
    });
  }

  // Section 1: Establish groove (Beats 4..19)
  addSingle(4);
  addSingle(8);
  addSingle(12);
  addSingle(16);

  // Section 2: Double-spit variation! (Beats 20..35)
  addSingle(20);
  addDouble(24);
  addSingle(28);
  addDouble(32);

  // Section 3: Mega Lob drama + rapid interplay! (Beats 36..51)
  addMegaLob(36, false);
  addSingle(40);
  addDouble(44);
  addDouble(48);

  // Section 4: Climax + SKILL STAR Mega Lob + Finale! (Beats 52..68)
  addSingle(52);
  addDouble(56);
  addMegaLob(60, true); // SKILL STAR on beat 63!
  addSingle(64);

  return { totalBeats: 70, cues, events };
}

function buildBurpChart() {
  const events = [];
  const cues = [];
  let eid = 1;

  cues.push({ beat: 0, kind: "count_tick", tag: "1", subStage: "burp" });
  cues.push({ beat: 1, kind: "count_tick", tag: "2", subStage: "burp" });
  cues.push({ beat: 2, kind: "count_tick", tag: "3", subStage: "burp" });
  cues.push({ beat: 3, kind: "count_go", tag: "GO!", subStage: "burp" });

  // Call & Response 2-pat echo: Cue on b, b+1 -> Player taps on b+2, b+3
  function addPatEcho(b) {
    cues.push({ beat: b, kind: "pat_todak", tag: "demo_pat", subStage: "burp" });
    cues.push({ beat: b + 1, kind: "pat_todak", tag: "demo_pat", subStage: "burp" });
    events.push({
      id: `b_${eid++}`, beat: b + 2, type: "tap", subStage: "burp",
      cueBeat: b, sfx: "pat_todak", comic: "토닥!", meta: { kind: "pat" },
    });
    events.push({
      id: `b_${eid++}`, beat: b + 3, type: "tap", subStage: "burp",
      cueBeat: b + 1, sfx: "pat_todak", comic: "토닥!", meta: { kind: "pat" },
    });
  }

  // Symphonic Burp Hold-and-Release: Cue "으음~" on b -> HOLD on b+1 -> RELEASE on b+3!
  function addBurpHold(b, skillStar = false) {
    if (skillStar) cues.push({ beat: b - 1, kind: "skill_star_cue", tag: "skill_star", subStage: "burp" });
    cues.push({ beat: b, kind: "burp_charge", tag: "burp_charge", subStage: "burp", releaseBeat: b + 3, golden: skillStar });
    events.push({
      id: `b_${eid++}`, beat: b + 1, type: "hold", subStage: "burp",
      cueBeat: b, sfx: "pat_todak", comic: "꾸욱~", meta: { kind: "burp_hold", releaseBeat: b + 3 },
    });
    events.push({
      id: `b_${eid++}`, beat: b + 3, type: "release", subStage: "burp",
      cueBeat: b + 1, sfx: "baby_burp", comic: skillStar ? "★ 꺼어억!!" : "꺼억!!",
      skillStar, meta: { kind: "burp_release", holdBeat: b + 1 },
    });
  }

  // Sleepy Shh Rest Fakeout: Cue "쉿~" on b -> DO NOT TAP at b+2!
  function addShhRest(b) {
    cues.push({ beat: b, kind: "shh_cue", tag: "shh", subStage: "burp", restBeat: b + 2 });
    events.push({
      id: `b_${eid++}`, beat: b + 2, type: "rest", subStage: "burp",
      cueBeat: b, sfx: null, comic: "Zzz...", meta: { kind: "shh_rest" },
    });
  }

  // Section 1: Cozy groove pats & first burp (Beats 4..19)
  addPatEcho(4);
  addPatEcho(8);
  addBurpHold(12, false);
  addPatEcho(16);

  // Section 2: Introduce Sleepy Shush fakeout! (Beats 20..35)
  addBurpHold(20, false);
  addShhRest(24);
  addPatEcho(28);
  addBurpHold(32, false);

  // Section 3: Playful mix of pats, rests & burps (Beats 36..51)
  addShhRest(36);
  addPatEcho(40);
  addBurpHold(44, false);
  addPatEcho(48);

  // Section 4: Climax Symphony Burp SKILL STAR + Peaceful Finale (Beats 52..68)
  addShhRest(52);
  addPatEcho(56);
  addBurpHold(60, true); // SKILL STAR on beat 63!
  addShhRest(64);

  return { totalBeats: 70, cues, events };
}

function buildPhotoChart() {
  const events = [];
  const cues = [];
  let eid = 1;

  cues.push({ beat: 0, kind: "count_tick", tag: "1", subStage: "photo" });
  cues.push({ beat: 1, kind: "count_tick", tag: "2", subStage: "photo" });
  cues.push({ beat: 2, kind: "count_tick", tag: "3", subStage: "photo" });
  cues.push({ beat: 3, kind: "count_go", tag: "GO!", subStage: "photo" });

  // Classic Peek-a-Boo: "까—"(b) -> "꿍!!"(b+2) -> TAP "찰칵!"(b+3)
  function addPeekaboo(b, sleepyDad = false) {
    cues.push({ beat: b, kind: "photo_peek", tag: "peek", subStage: "photo", sleepyDad });
    cues.push({ beat: b + 2, kind: "photo_boo", tag: "boo", subStage: "photo", sleepyDad });
    events.push({
      id: `ph_${eid++}`, beat: b + 3, type: "tap", subStage: "photo",
      cueBeat: b + 2, sfx: "shutter_snap", comic: "찰칵!", meta: { kind: "peekaboo", sleepyDad },
    });
  }

  // Rapid Left-Right Whip-Pan: "여기!"(b) -> TAP(b+1), "저기!"(b+2) -> TAP(b+3)
  function addWhipPair(b) {
    cues.push({ beat: b, kind: "photo_here", tag: "whip_left", subStage: "photo" });
    events.push({
      id: `ph_${eid++}`, beat: b + 1, type: "tap", subStage: "photo",
      cueBeat: b, sfx: "shutter_snap", comic: "찰칵!", meta: { kind: "whip_left", side: -1 },
    });
    cues.push({ beat: b + 2, kind: "photo_here", tag: "whip_right", subStage: "photo" });
    events.push({
      id: `ph_${eid++}`, beat: b + 3, type: "tap", subStage: "photo",
      cueBeat: b + 2, sfx: "shutter_snap", comic: "찰칵!!", meta: { kind: "whip_right", side: 1 },
    });
  }

  // Angel Pose Double Snap: "포~즈!"(b) -> TAP(b+2) + TAP(b+3)!
  function addAngelPose(b, skillStar = false) {
    if (skillStar) cues.push({ beat: b - 1, kind: "skill_star_cue", tag: "skill_star", subStage: "photo" });
    cues.push({ beat: b, kind: "photo_pose", tag: "pose", subStage: "photo", golden: skillStar });
    events.push({
      id: `ph_${eid++}`, beat: b + 2, type: "tap", subStage: "photo",
      cueBeat: b, sfx: "shutter_snap", comic: "반짝!", meta: { kind: "pose1" },
    });
    events.push({
      id: `ph_${eid++}`, beat: b + 3, type: "tap", subStage: "photo",
      cueBeat: b, sfx: "shutter_snap", comic: skillStar ? "★ 인생샷!!" : "완벽해!",
      skillStar, meta: { kind: "pose2" },
    });
  }

  // Section 1: Classic studio warmup
  addPeekaboo(4, false);
  addPeekaboo(8, false);
  addWhipPair(12);
  addPeekaboo(16, true); // Sleepy Dad gag!

  // Section 2: Angel Pose + Whip-Pans
  addAngelPose(20, false);
  addWhipPair(24);
  addPeekaboo(28, true);
  addAngelPose(32, false);

  // Section 3: Studio overdrive!
  addWhipPair(36);
  addWhipPair(40);
  addPeekaboo(44, true);
  addAngelPose(48, false);

  // Section 4: Climax + SKILL STAR Angel Pose!
  addWhipPair(52);
  addPeekaboo(56, false);
  addAngelPose(60, true); // SKILL STAR on beat 63!
  addPeekaboo(64, true);

  return { totalBeats: 70, cues, events };
}

function buildNinjaChart() {
  const events = [];
  const cues = [];
  let eid = 1;

  cues.push({ beat: 0, kind: "count_tick", tag: "1", subStage: "ninja" });
  cues.push({ beat: 1, kind: "count_tick", tag: "2", subStage: "ninja" });
  cues.push({ beat: 2, kind: "count_tick", tag: "3", subStage: "ninja" });
  cues.push({ beat: 3, kind: "count_go", tag: "GO!", subStage: "ninja" });

  function addStep(b, blind = false) {
    events.push({
      id: `n_${eid++}`, beat: b, type: "tap", subStage: "ninja",
      cueBeat: b - 1, sfx: "ninja_step", comic: blind ? "살금..." : "살금!",
      meta: { kind: "step", blind, stepIndex: b },
    });
  }

  function addFreeze(b) {
    cues.push({ beat: b, kind: "ninja_freeze", tag: "freeze", subStage: "ninja" });
    events.push({
      id: `n_${eid++}`, beat: b + 1, type: "rest", subStage: "ninja",
      cueBeat: b, sfx: null, comic: "얼음!", meta: { kind: "freeze" },
    });
    events.push({
      id: `n_${eid++}`, beat: b + 2, type: "rest", subStage: "ninja",
      cueBeat: b, sfx: null, comic: "휴~", meta: { kind: "freeze" },
    });
    cues.push({ beat: b + 3, kind: "ninja_go", tag: "go", subStage: "ninja" });
  }

  // Walk 1 (Beats 4..11) — steady 8 beats to lock into stealth groove!
  for (let b = 4; b <= 11; b++) addStep(b, false);

  // Freeze 1 (Beats 12..15)
  addFreeze(12);

  // Walk 2 (Beats 16..23)
  for (let b = 16; b <= 23; b++) addStep(b, false);

  // Freeze 2 (Beats 24..27)
  addFreeze(24);

  // Walk 3 leading into BLACKOUT! (Beats 28..35)
  for (let b = 28; b <= 35; b++) addStep(b, false);

  // BLACKOUT BLIND STEALTH RUN #1! (Beats 36..41)
  cues.push({ beat: 36, kind: "ninja_lights_out", tag: "lights_out", subStage: "ninja", endBeat: 41 });
  for (let b = 37; b <= 40; b++) addStep(b, true);
  cues.push({ beat: 41, kind: "ninja_go", tag: "lights_on", subStage: "ninja" });

  // Walk + Freeze combo (Beats 42..51)
  for (let b = 42; b <= 47; b++) addStep(b, false);
  addFreeze(48);

  // BLACKOUT BLIND STEALTH RUN #2! (Beats 52..57)
  cues.push({ beat: 52, kind: "ninja_lights_out", tag: "lights_out", subStage: "ninja", endBeat: 57 });
  for (let b = 53; b <= 56; b++) addStep(b, true);
  cues.push({ beat: 57, kind: "ninja_go", tag: "lights_on", subStage: "ninja" });

  // Final dash to the golden exit door! (Beats 58..61)
  for (let b = 58; b <= 61; b++) addStep(b, false);

  // Dramatic Door Latch Finale (SKILL STAR on Beat 65!)
  cues.push({ beat: 62, kind: "skill_star_cue", tag: "skill_star", subStage: "ninja" });
  cues.push({ beat: 63, kind: "ninja_freeze", tag: "door_zoom", subStage: "ninja" });
  events.push({
    id: `n_${eid++}`, beat: 65, type: "tap", subStage: "ninja",
    cueBeat: 63, sfx: "door_click", comic: "★ 육퇴 성공!!",
    skillStar: true, meta: { kind: "door" },
  });

  return { totalBeats: 70, cues, events };
}

function buildRemixChart() {
  const events = [];
  const cues = [];
  let eid = 1;

  cues.push({ beat: 0, kind: "count_tick", tag: "1", subStage: "pacifier" });
  cues.push({ beat: 1, kind: "count_tick", tag: "2", subStage: "pacifier" });
  cues.push({ beat: 2, kind: "count_tick", tag: "3", subStage: "pacifier" });
  cues.push({ beat: 3, kind: "count_go", tag: "GO!", subStage: "pacifier" });

  const cut = (b, to) => cues.push({ beat: b, kind: "remix_cut", tag: "smash_cut", subStage: to });

  // ACT 1: PACIFIER (Beats 4..19)
  const pacSingle = (b) => {
    cues.push({ beat: b, kind: "baby_puff", tag: "puff", subStage: "pacifier" });
    cues.push({ beat: b + 1, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2 });

  };
  const pacDouble = (b) => {
    cues.push({ beat: b, kind: "baby_puff", tag: "puff", subStage: "pacifier" });
    cues.push({ beat: b + 1, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2, lane: -1 });
    cues.push({ beat: b + 1.5, kind: "baby_spit", tag: "spit", subStage: "pacifier", targetBeat: b + 2.5, lane: 1 });
    events.push({ id: `r_${eid++}`, beat: b + 2, type: "tap", subStage: "pacifier", cueBeat: b + 1, sfx: "dad_catch", comic: "쫍!", meta: { kind: "double1", spitBeat: b + 1, lane: -1 } });
    events.push({ id: `r_${eid++}`, beat: b + 2.5, type: "tap", subStage: "pacifier", cueBeat: b + 1.5, sfx: "dad_catch", comic: "쫍!!", meta: { kind: "double2", spitBeat: b + 1.5, lane: 1 } });

  const subTimeline = [
    { startBeat: 0, subStage: "pacifier" },
    { startBeat: 20, subStage: "burp" },

    { startBeat: 52, subStage: "ninja" },

    { startBeat: 80, subStage: "pacifier" },
    { startBeat: 84, subStage: "photo" },

}

// 5 Bespoke 7-Layer Cinematic Stage Renderers + 5 Bespoke 3.2s Title Card Mini-Animations
// Each stage renders:
//   [L0] Sky / Atmosphere -> [L1] Volumetric Light Beams -> [L2] Distant Parallax
//   [L3] Midground Beat-Reactive Props -> [L4] Ground & Contact Shadows
//   [L5] Rigged Cel-Shaded Characters -> [L6] Foreground Framing Silhouettes -> [L7] Minimal "나" Tag

class StageVisualState {
  constructor() {
    this.reset();
  }
  reset() {
    this.babyExpr = "happy";
    this.babyExprTimer = 0;
    this.dadExpr = "tired";
    this.dadExprTimer = 0;
    this.dadHand = new Spring(0, 320, 18);
    this.babyBounce = new Spring(0, 260, 14);
    this.babyCheek = new Spring(0, 220, 14);
    this.babyBelly = new Spring(0, 140, 12);
    this.fanOpen = new Spring(0, 260, 16);
    this.dadBump = false;
    this.pacifiers = []; // active arcing pacifiers
    this.photoSnapshots = []; // floating instant polaroids snapped during Stage 3
    this.photoFlashText = "";
    this.photoFlashTimer = 0;
    this.photoSide = 0; // -1 left, 0 center, 1 right
    this.sleepyDad = false;
    this.ninjaSteps = 0;
    this.ninjaFrozen = false;
    this.ninjaDuckSquish = 0;
    this.ninjaDoorOpen = 0;
    this.ninjaMonitorAlert = 0;
    this.shhMode = 0;
    this.holding = false;
    this.fever = 0; // 0..1 rises with combo streak
    this.skillStarActive = false;
    this.skillStarBanner = 0;
    this.finale = false;
  }
  update(dt) {
    const s = Math.min(dt, 0.05);
    this.dadHand.update(s);
    this.babyBounce.update(s);
    this.babyCheek.update(s);
    this.babyBelly.update(s);
    this.fanOpen.update(s);
    if (this.babyExprTimer > 0) {
      this.babyExprTimer -= s;
      if (this.babyExprTimer <= 0 && !this.holding && !this.finale) this.babyExpr = "happy";
    }
    if (this.dadExprTimer > 0) {
      this.dadExprTimer -= s;
      if (this.dadExprTimer <= 0 && !this.ninjaFrozen && !this.finale) {
        this.dadExpr = "tired";
        this.dadBump = false;
      }
    }
    if (this.photoFlashTimer > 0) this.photoFlashTimer -= s;
    if (this.ninjaDuckSquish > 0) this.ninjaDuckSquish = Math.max(0, this.ninjaDuckSquish - s * 2.5);
    if (this.ninjaMonitorAlert > 0) this.ninjaMonitorAlert = Math.max(0, this.ninjaMonitorAlert - s * 1.4);
    if (this.skillStarBanner > 0) this.skillStarBanner = Math.max(0, this.skillStarBanner - s);
    this.shhMode = Math.max(0, this.shhMode - s * 0.7);
    for (let i = this.photoSnapshots.length - 1; i >= 0; i--) {
      this.photoSnapshots[i].age += s;
      if (this.photoSnapshots[i].age > 2.2) this.photoSnapshots.splice(i, 1);
    }
  }
}

function drawPacifierStage(ctx, beat, vis, cam) {
  const bPulse = Math.pow(Math.max(0, 1 - (beat % 1) * 2.2), 2);
  const fever = vis.fever;

  // [L0] Deep starry crescent moon night sky seen through grand window
  const wallGrad = ctx.createLinearGradient(0, 0, 0, H);
  wallGrad.addColorStop(0, "#24194A");
  wallGrad.addColorStop(0.65, "#3E2A6E");
  wallGrad.addColorStop(1, "#2A1B47");
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle pastel nursery wallpaper stripes & stars
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
  for (let x = 0; x < W; x += 64) ctx.fillRect(x, 0, 28, H);
  ctx.restore();

  // Grand arched nursery window (right-center background)
  const wx = 780, wy = 62, ww = 350, wh = 290;
  ctx.save();
  roundRectPath(ctx, wx, wy, ww, wh, 32);
  ctx.clip();
  const skyGrad = ctx.createLinearGradient(wx, wy, wx, wy + wh);
  skyGrad.addColorStop(0, "#0D1238");
  skyGrad.addColorStop(1, "#2D357A");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(wx, wy, ww, wh);
  // Twinkling stars dancing to beat!
  for (let i = 0; i < 16; i++) {
    const sx = wx + 28 + ((i * 73) % (ww - 56));
    const sy = wy + 24 + ((i * 47) % (wh - 90));
    const sr = 2.5 + ((i % 3) === 0 ? 2 : 0) + (i % 2 === 0 ? bPulse * 2.5 : 0);
    ctx.fillStyle = i % 3 === 0 ? "#FFE156" : "#FFFFFF";
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }
  // Glowing crescent moon
  ctx.save();
  ctx.translate(wx + 245, wy + 92);
  ctx.rotate(Math.sin(beat * 0.4) * 0.08);
  ctx.fillStyle = "#FFF199";
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#192056";
  ctx.beginPath(); ctx.arc(16, -10, 38, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Distant night rooftops silhouette
  ctx.fillStyle = "#181B45";
  ctx.fillRect(wx, wy + 220, ww, 80);
  ctx.fillRect(wx + 20, wy + 185, 65, 50);
  ctx.fillRect(wx + 120, wy + 170, 82, 60);
  ctx.fillRect(wx + 235, wy + 195, 70, 40);
  ctx.restore();
  // Window frame & sill
  roundRectPath(ctx, wx, wy, ww, wh, 32);
  ctx.lineWidth = 8; ctx.strokeStyle = "#5B428A"; ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(wx + ww * 0.5, wy); ctx.lineTo(wx + ww * 0.5, wy + wh);
  ctx.moveTo(wx, wy + wh * 0.55); ctx.lineTo(wx + ww, wy + wh * 0.55);
  ctx.lineWidth = 6; ctx.strokeStyle = "#5B428A"; ctx.stroke();

  // [L1] Volumetric diagonal moonlight shaft through window!
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const beam = ctx.createLinearGradient(wx + 200, wy + 60, 420, 620);
  beam.addColorStop(0, `rgba(210, 225, 255, ${0.18 + fever * 0.1})`);
  beam.addColorStop(1, "rgba(180, 200, 255, 0)");
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(wx + 40, wy + 40);
  ctx.lineTo(wx + ww - 20, wy + 40);
  ctx.lineTo(540, H);
  ctx.lineTo(140, H);
  ctx.closePath();

  // [L2/L3] Rotating hanging nursery cloud & star mobile (spins faster in Fever!)
  const mobX = 640;
  ctx.save();
  ctx.translate(mobX, 0);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 68); ctx.stroke();
  const spin = beat * (0.65 + fever * 0.6);
  ctx.beginPath(); ctx.moveTo(-115, 68); ctx.lineTo(115, 68); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const ang = spin + (i * Math.PI * 2) / 3;
    const mx = Math.cos(ang) * 98;

    ctx.beginPath(); ctx.moveTo(mx, 68); ctx.lineTo(mx, my); ctx.stroke();
    drawStarPath(ctx, mx, my + 8, 5, 18, 8);
    ctx.fillStyle = ["#FFE156", "#FF8FA3", "#7CE8FF"][i];
    ctx.fill();
    ctx.stroke();

  // Floor & cozy circular rug
  ctx.fillStyle = "#332257";
  ctx.fillRect(0, 495, W, H - 495);
  ctx.beginPath();
  ctx.moveTo(0, 495); ctx.lineTo(W, 495);
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(680, 560, 420, 74, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#6B4E9B";
  ctx.fill();
  ctx.stroke();

  // Glowing sheep nightlight on left nightstand (pulses with music!)
  ctx.save();
  ctx.translate(155, 442);
  roundRectPath(ctx, -46, 0, 92, 90, 12);
  ctx.fillStyle = "#6D4A8C"; ctx.fill(); ctx.stroke();
  const ng = ctx.createRadialGradient(0, -24, 5, 0, -24, 72 + bPulse * 18);
  ng.addColorStop(0, "rgba(255, 240, 160, 0.72)");
  ng.addColorStop(1, "rgba(255, 220, 120, 0)");
  ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(0, -24, 78, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -20, 24, 0, Math.PI * 2);
  ctx.fillStyle = "#FFF7CC"; ctx.fill(); ctx.stroke();
  ctx.restore();

  // [L4] Wooden Crib (back rail + mattress + bouncing plush bear!)
  const cribX = 680, cribY = 390;
  drawContactShadow(ctx, cribX, 535, 245, 36, 0.35);
  // Back headboard
  roundRectPath(ctx, cribX - 220, cribY - 88, 440, 165, 26);
  ctx.fillStyle = "#E8B57C"; ctx.fill(); ctx.stroke();
  // Soft mint crib mattress
  roundRectPath(ctx, cribX - 204, cribY + 12, 408, 72, 18);
  ctx.fillStyle = "#A9F0E2"; ctx.fill(); ctx.stroke();

  // Cute plush teddy bear in crib corner bouncing on beat!
  ctx.save();
  ctx.translate(cribX + 146, cribY - 12 - bPulse * 12);
  ctx.rotate(Math.sin(beat * Math.PI) * 0.08);
  ctx.fillStyle = "#C98556";
  ctx.beginPath(); ctx.arc(-16, -24, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(16, -24, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -8, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 20, 20, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-7, -10, 3, 0, Math.PI * 2); ctx.arc(7, -10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // [L5] Articulated Baby inside the crib!
  const babySquash = vis.babyBounce.val;
  const hasPaci = vis.pacifiers.every((p) => p.done) && vis.babyExpr !== "spit" && vis.babyExpr !== "giggle";
  drawBaby(ctx, {
    x: cribX - 10,
    y: cribY - 26 - bPulse * 9 + babySquash * 14,
    scale: 1.18,
    sx: 1 + babySquash * 0.14,
    sy: 1 - babySquash * 0.14,
    expr: vis.babyExpr,
    cheekInflation: clamp(vis.babyCheek.val, 0, 1),
    armL: -0.5 + Math.sin(beat * Math.PI) * 0.35,
    armR: -0.5 - Math.sin(beat * Math.PI) * 0.35,
    hasPacifier: hasPaci,
    hairLag: Math.sin(beat * Math.PI) * 0.18,
    onesie: "#7CE8FF",
    shadow: false,
  });

  // Crib front wooden slats (layering Baby cleanly INSIDE the crib!)
  ctx.fillStyle = "#F5C792";
  ctx.lineWidth = 4; ctx.strokeStyle = INK;
  roundRectPath(ctx, cribX - 224, cribY + 46, 448, 20, 10); ctx.fill(); ctx.stroke();
  for (let sxp = -196; sxp <= 196; sxp += 49) {
    roundRectPath(ctx, cribX + sxp - 7, cribY + 56, 14, 72, 6);
    ctx.fillStyle = "#E8B57C"; ctx.fill(); ctx.stroke();
  }
  roundRectPath(ctx, cribX - 224, cribY + 114, 448, 24, 10);
  ctx.fillStyle = "#D49B63"; ctx.fill(); ctx.stroke();

  // Arcing perspective pacifiers flying from Baby toward Foreground Dad!
  for (const p of vis.pacifiers) {
    if (p.done) continue;
    const t = clamp((beat - p.startBeat) / Math.max(0.25, p.targetBeat - p.startBeat), 0, 1.35);
    const sx0 = cribX - 10;
    const sy0 = cribY - 46;
    const tx = 415 + (p.lane || 0) * 65;
    const ty = 520;
    const arcH = p.isLob ? 320 : 185;
    const px = lerp(sx0, tx, t);
    const py = lerp(sy0, ty, t) - Math.sin(clamp(t, 0, 1) * Math.PI) * arcH;
    const pScale = lerp(0.78, p.isLob ? 2.55 : 2.0, clamp(t, 0, 1.15));
    // Speed motion trail!
    if (t > 0.08 && t < 1.1) {
      ctx.save();
      ctx.globalAlpha = 0.3;
      drawPacifier(ctx, lerp(sx0, tx, t - 0.09), lerp(sy0, ty, t - 0.09) - Math.sin(clamp(t - 0.09, 0, 1) * Math.PI) * arcH, pScale * 0.86, t * 14 - 1, p.golden);
      ctx.restore();
    }
    drawPacifier(ctx, px, py, pScale, t * (p.isLob ? 18 : 13), p.golden);
  }

  // [L6] Foreground Over-the-Shoulder Pajama Dad + Framing Silhouette!
  drawDad(ctx, {
    x: 245,
    y: 575 + bPulse * 6,
    scale: 1.16,
    mode: "ots",
    expr: vis.dadExpr,
    handAction: vis.dadHand.val,
  });

  // Foreground right lamp-shade framing silhouette for deep 7-layer cinema lens feel!
  ctx.save();
  ctx.fillStyle = "#160D2B";
  ctx.beginPath();
  ctx.moveTo(W + 20, H + 20);
  ctx.lineTo(W - 140, H + 20);
  ctx.quadraticCurveTo(W - 95, H - 150, W + 20, H - 220);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // [L7] Ultra-minimal Rhythm Heaven "나" tag near Dad's hand
  drawYouTag(ctx, 245, 682, bPulse);
}

// =========================================================================
// STAGE 2: 꺼억! 트림 오케스트라 (7-Layer Warm Jazz Living Room)
// =========================================================================
function drawBurpStage(ctx, beat, vis) {
  const bPulse = Math.pow(Math.max(0, 1 - (beat % 1) * 2.2), 2);
  const rock = Math.sin(beat * Math.PI * 0.5) * 0.06;

  // [L0] Warm amber midnight living room backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#3D1D1E");
  bg.addColorStop(0.65, "#6E352B");
  bg.addColorStop(1, "#45211D");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle music-staff wallpaper pattern
  ctx.save();
  ctx.strokeStyle = "rgba(255, 224, 165, 0.06)";
  ctx.lineWidth = 2;
  for (let row = 0; row < 4; row++) {
    const base = 70 + row * 155;
    for (let l = 0; l < 5; l++) {
      ctx.beginPath(); ctx.moveTo(0, base + l * 10); ctx.lineTo(W, base + l * 10); ctx.stroke();
    }
  }
  ctx.restore();

  // [L1] Warm floor-lamp cone & stage spotlight glow!
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const lampG = ctx.createRadialGradient(230, 210, 15, 230, 320, 420);
  lampG.addColorStop(0, `rgba(255, 224, 140, ${0.42 - vis.shhMode * 0.18})`);
  lampG.addColorStop(1, "rgba(255, 180, 90, 0)");
  ctx.fillStyle = lampG;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // [L2/L3] Vintage Jazz Vinyl Player on right shelf + Standing Floor Lamp on left!
  // Floor lamp
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(225, 215); ctx.lineTo(225, 580); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(160, 230); ctx.lineTo(188, 130); ctx.lineTo(262, 130); ctx.lineTo(290, 230); ctx.closePath();
  ctx.fillStyle = "#FFD166"; ctx.fill(); ctx.stroke();

  // Jazz vinyl shelf (right) — turntable spins with beat!
  roundRectPath(ctx, 920, 355, 240, 195, 16);
  ctx.fillStyle = "#8B4A32"; ctx.fill(); ctx.stroke();
  // Spinning vinyl record
  ctx.save();
  ctx.translate(1030, 336);
  ctx.beginPath(); ctx.ellipse(0, 0, 74, 22, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#1E162B"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#FF5D8F"; ctx.fill();
  // Bouncing equalizer bars on vintage amp!
  for (let i = 0; i < 6; i++) {
    const bh = 16 + Math.abs(Math.sin(beat * Math.PI + i * 0.9)) * 34 * (1 - vis.shhMode * 0.7);
    ctx.fillStyle = i % 2 === 0 ? "#FFE156" : "#FF8FA3";
    ctx.fillRect(-78 + i * 26, 95 - bh, 18, bh);
  }
  ctx.restore();

  // Floor
  ctx.fillStyle = "#4A231D";
  ctx.fillRect(0, 545, W, H - 545);
  ctx.beginPath(); ctx.moveTo(0, 545); ctx.lineTo(W, 545); ctx.lineWidth = 4; ctx.stroke();

  // [L4] Contact shadow under rocking chair
  drawContactShadow(ctx, 640, 625, 230, 34, 0.36);

  // [L5] Centerpiece: Wood-Slat Rocking Chair + Striped Pajama Dad + Baby Facing Camera!
  ctx.save();
  ctx.translate(640, 595);
  ctx.rotate(rock);

  // Curved wooden rocker rails + chair legs
  ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
  ctx.fillStyle = "#A45334";
  roundRectPath(ctx, -135, -75, 24, 90, 8); ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 111, -75, 24, 90, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-215, 16);
  ctx.quadraticCurveTo(0, 56, 215, 16);
  ctx.lineWidth = 18; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = 10; ctx.strokeStyle = "#C97542"; ctx.stroke();

  // Wooden slatted chair backrest + plush tufted cushion
  ctx.lineWidth = 4.5; ctx.strokeStyle = INK;
  roundRectPath(ctx, -195, -370, 390, 305, 48);
  ctx.fillStyle = "#9C4A2F"; ctx.fill(); ctx.stroke();
  roundRectPath(ctx, -162, -338, 324, 242, 36);
  ctx.fillStyle = "#EFA56A"; ctx.fill(); ctx.stroke();
  // Armrests
  roundRectPath(ctx, -212, -135, 62, 26, 12); ctx.fillStyle = "#B5603B"; ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 150, -135, 62, 26, 12); ctx.fill(); ctx.stroke();

  // Dad's broad striped pajama torso + loving profile head!
  roundRectPath(ctx, -168, -210, 265, 175, 68);
  ctx.fillStyle = "#485E9B"; ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = "#627BBD";
  for (let xp = -160; xp <= 110; xp += 28) ctx.fillRect(xp, -220, 12, 200);
  ctx.restore();
  ctx.stroke();

  // Cozy cream burp cloth draped over Dad's right shoulder!
  roundRectPath(ctx, -26, -218, 138, 148, 26);
  ctx.fillStyle = "#FFF7EC"; ctx.fill(); ctx.stroke();

  // Dad's profile face leaning gently near Baby!
  ctx.save();
  ctx.translate(-112, -234);
  ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI * 2);
  ctx.fillStyle = "#F7CAA8"; ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.arc(-8, -10, 53, Math.PI * 0.65, Math.PI * 1.92);
  ctx.quadraticCurveTo(30, -48, 14, -26);
  ctx.quadraticCurveTo(-8, -32, -26, 16);
  ctx.closePath();
  ctx.fillStyle = "#31243D"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(24, -2, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(22, 16, 10, 0.1 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  // Articulated Baby perched OVER Dad's shoulder looking directly at the player!
  const bSq = vis.babyBounce.val;

    x: 42,
    y: -178 + bSq * 15 - bPulse * 6,
    scale: 1.46,
    sx: 1 + bSq * 0.14 + swell * 0.1,
